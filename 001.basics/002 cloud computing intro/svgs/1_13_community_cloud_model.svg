<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="260" y="30" text-anchor="middle" font-size="15" font-weight="bold">Community Cloud Model</text>

  <path d="M110,90 C 80,100 80,150 110,155 C 95,185 140,200 165,185 C 195,205 250,195 245,165 C 285,165 295,120 255,105 C 260,80 215,65 190,80 C 170,60 125,65 110,90 Z" fill="#3f8fc4"/>
  <g fill="#fff" stroke="#333" stroke-width="1">
    <rect x="140" y="110" width="20" height="35"/>
    <rect x="180" y="105" width="20" height="35"/>
    <rect x="220" y="115" width="20" height="35"/>
    <rect x="160" y="130" width="20" height="35"/>
    <rect x="200" y="130" width="20" height="35"/>
  </g>

  <rect x="80" y="255" width="160" height="90" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="115" y="345" font-size="11">Organization 1</text>
  <rect x="270" y="255" width="160" height="90" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="305" y="345" font-size="11">Organization 2</text>

  <g stroke="#666" stroke-width="1" stroke-dasharray="3,3">
    <line x1="185" y1="200" x2="110" y2="280"/>
    <line x1="185" y1="200" x2="160" y2="280"/>
    <line x1="185" y1="200" x2="210" y2="280"/>
    <line x1="185" y1="200" x2="300" y2="280"/>
    <line x1="185" y1="200" x2="350" y2="280"/>
    <line x1="185" y1="200" x2="400" y2="280"/>
  </g>

  <text x="530" y="60" font-size="13" font-weight="bold">BENEFITS</text>
  <g font-size="11">
    <text x="530" y="80">Cost effective</text>
    <text x="530" y="95">Sharing Between Organizations</text>
    <text x="530" y="110">Security</text>
  </g>
  <text x="530" y="140" font-size="13" font-weight="bold">ISSUES</text>
  <g font-size="10">
    <text x="530" y="160">Since all data is housed at one</text>
    <text x="530" y="173">location, one must be careful</text>
    <text x="530" y="186">storing data in community cloud</text>
    <text x="530" y="199">because it might be accessible</text>
    <text x="530" y="212">by others.</text>
    <text x="530" y="230">It is also challenging to allocate</text>
    <text x="530" y="243">responsibilities of governance,</text>
    <text x="530" y="256">security and cost.</text>
  </g>
</svg>
