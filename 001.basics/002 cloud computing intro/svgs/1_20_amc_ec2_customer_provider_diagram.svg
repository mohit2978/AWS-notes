  <text x="150" y="80" font-size="10" fill="#1a5276">VM's = Instances</text>
  <text x="150" y="95" font-size="9" fill="#1e8449">EC2 is a AWS web service</text>
  <text x="150" y="108" font-size="9" fill="#1e8449">where you can create VM's</text>

