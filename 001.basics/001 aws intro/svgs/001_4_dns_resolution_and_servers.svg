<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>

  <rect x="150" y="20" width="220" height="50" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="260" y="38" text-anchor="middle" font-size="12">www.holbertonschool.com</text>
  <text x="185" y="55" text-anchor="middle" font-size="9">A RECORD</text>
  <text x="260" y="55" text-anchor="middle" font-size="9">DOMAIN NAME</text>
  <text x="335" y="55" text-anchor="middle" font-size="9">TOP LEVEL DOMAIN</text>
  <text x="260" y="80" text-anchor="middle" font-size="10">DNS A Record: points to server IP 8.8.8.8</text>

