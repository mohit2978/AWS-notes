  <path d="M560,370 L420,370" stroke="#c0392b" stroke-width="2" marker-end="url(#a5r)"/>
  <text x="450" y="390" font-size="10" fill="#c0392b">HTML content</text>

  <rect x="565" y="230" width="20" height="330" fill="#e67e22"/>
