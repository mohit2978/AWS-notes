  <text x="700" y="310" text-anchor="middle" font-size="8">STATIC</text>
  <text x="760" y="310" text-anchor="middle" font-size="8">DYNAMIC</text>
  <text x="890" y="330" text-anchor="middle" font-size="8">DATABASE</text>

  <rect x="650" y="400" width="330" height="150" fill="none" stroke="#7d3c98" stroke-width="1.5" rx="10"/>
  <text x="815" y="565" text-anchor="middle" font-size="12" font-weight="bold">Server B</text>
  <rect x="670" y="430" width="130" height="90" fill="none" stroke="#7d3c98" stroke-width="1"/>
  <text x="735" y="445" text-anchor="middle" font-size="9">WEB SERVER</text>
  <rect x="820" y="430" width="140" height="90" fill="none" stroke="#7d3c98" stroke-width="1"/>
  <text x="890" y="445" text-anchor="middle" font-size="9">APPLICATION SERVER</text>
  <text x="700" y="480" text-anchor="middle" font-size="8">STATIC</text>
  <text x="760" y="480" text-anchor="middle" font-size="8">DYNAMIC</text>
  <text x="890" y="500" text-anchor="middle" font-size="8">DATABASE</text>

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7d3c98"/></marker>
    <marker id="a5r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/></marker>
