  <rect x="670" y="260" width="130" height="90" fill="none" stroke="#7d3c98" stroke-width="1"/>
  <text x="735" y="275" text-anchor="middle" font-size="9">WEB SERVER</text>
  <rect x="820" y="260" width="140" height="90" fill="none" stroke="#7d3c98" stroke-width="1"/>
