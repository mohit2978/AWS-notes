  <rect x="170" y="470" width="60" height="45" fill="none" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="200" y="530" text-anchor="middle" font-size="11">computer / browser</text>

  <path d="M420,340 L560,340" stroke="#c0392b" stroke-width="2" marker-end="url(#a5r)"/>
