  <path d="M150,300 L150,390" stroke="#000" stroke-width="1.5" marker-end="url(#a5)"/>
  <path d="M140,390 L140,300" stroke="#1e8449" stroke-width="1.5" marker-end="url(#a5r)"/>
  <text x="115" y="350" font-size="9" transform="rotate(-90 115 350)">52.206.180.197</text>

  <rect x="185" y="400" width="70" height="60" fill="none" stroke="#2e86c1" stroke-width="1"/>
