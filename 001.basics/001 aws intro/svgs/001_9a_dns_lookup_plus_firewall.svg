<svg viewBox="0 0 980 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="980" height="400" fill="#ffffff"/>

  <rect x="240" y="15" width="200" height="45" fill="none" stroke="#8e2418" stroke-width="1.5"/>
  <text x="270" y="30" font-size="10" fill="#1e8449">Which identify the domain name</text>
  <text x="270" y="45" font-size="10" font-weight="bold" fill="#c0392b">Name Server</text>
  <text x="380" y="45" font-size="10" font-weight="bold" fill="#c0392b">SOA</text>
  <text x="380" y="57" font-size="10" fill="#1a237e">has the IP</text>

  <text x="180" y="80" font-size="12" fill="#2e86c1">.com</text>
  <text x="165" y="100" font-size="11" font-weight="bold" fill="#c0392b">Top Level Domain</text>
  <text x="130" y="120" font-size="11" fill="#2e86c1">.org</text>
  <text x="220" y="120" font-size="11" fill="#2e86c1">.in</text>

  <text x="140" y="150" font-size="11" font-weight="bold" fill="#1e8449">Identify .com, .in etc</text>
  <text x="150" y="170" font-size="12" font-weight="bold" fill="#c0392b">Root Name Server</text>
  <text x="200" y="190" font-size="11" font-weight="bold" fill="#c0392b">RNS</text>

  <text x="120" y="225" font-size="10" fill="#2e4053">/etc/host  Local DNS has IP</text>
  <text x="120" y="245" font-size="11" font-weight="bold" fill="#c0392b">Local DNS</text>

  <rect x="90" y="270" width="110" height="70" fill="none" stroke="#000" stroke-width="2"/>
  <text x="145" y="310" text-anchor="middle" font-size="12" fill="#1e8449">Browser</text>
  <text x="90" y="360" font-size="11" font-weight="bold" fill="#c0392b">Srinivas's Laptop</text>

  <text x="280" y="295" font-size="10" fill="#7d3c98">HostName</text>
  <text x="280" y="310" font-size="10" fill="#7d3c98">google.com</text>
  <text x="280" y="335" font-size="10" fill="#7d3c98">IP</text>

  <text x="360" y="285" font-size="10" font-weight="bold">DNS = Domain Name Server</text>
  <text x="360" y="305" font-size="10" fill="#2e86c1">It keeps track of all hostnames and IP address</text>
  <text x="360" y="322" font-size="10" fill="#2e86c1">DNS will convert IP to Host and Host to IP</text>

  <!-- network path with data packets -->
  <path d="M420,190 Q 480,150 530,180 T 620,180" stroke="#000" stroke-width="1.5" fill="none"/>
  <text x="500" y="215" font-size="11" fill="#c0392b">Network</text>
  <ellipse cx="450" cy="150" rx="30" ry="18" fill="none" stroke="#7d3c98"/>
  <text x="450" y="154" text-anchor="middle" font-size="9" fill="#7d3c98">Data pkts</text>
  <ellipse cx="520" cy="120" rx="30" ry="18" fill="none" stroke="#7d3c98"/>
  <text x="520" y="124" text-anchor="middle" font-size="9" fill="#7d3c98">Data pkts</text>
  <ellipse cx="590" cy="90" rx="30" ry="18" fill="none" stroke="#7d3c98"/>
  <text x="590" y="94" text-anchor="middle" font-size="9" fill="#7d3c98">Data pkts</text>

  <rect x="650" y="60" width="300" height="210" fill="none" stroke="#1a237e" stroke-width="2"/>
  <text x="670" y="85" font-size="13" font-weight="bold" fill="#c0392b">Allow</text>
  <text x="670" y="105" font-size="13" font-weight="bold" fill="#c0392b">Deny</text>
  <text x="670" y="140" font-size="13" font-weight="bold" fill="#2e86c1">Rule</text>
  <text x="670" y="255" font-size="12" font-weight="bold" fill="#c0392b">Firewall</text>
  <text x="800" y="295" text-anchor="middle" font-size="13" font-weight="bold">Google Company</text>

  <defs>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
  </defs>
</svg>
