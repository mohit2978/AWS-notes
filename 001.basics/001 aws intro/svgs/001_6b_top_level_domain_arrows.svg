<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="460" height="380" fill="#ffffff"/>
  <text x="230" y="60" text-anchor="middle" font-size="16" fill="#2e86c1">.com</text>
  <text x="230" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Top Level Domain</text>

  <text x="60" y="190" font-size="15" fill="#2e86c1">.org</text>
  <text x="370" y="190" font-size="15" fill="#2e86c1">.in</text>

  <path d="M230,240 L230,100" stroke="#c0392b" stroke-width="3" marker-end="url(#a7red)"/>
  <path d="M230,240 L90,200" stroke="#2e86c1" stroke-width="3" marker-end="url(#a7blue)"/>
  <path d="M230,240 L350,200" stroke="#2e86c1" stroke-width="3" marker-end="url(#a7blue)"/>

  <text x="230" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">Identify .com, .in  etc</text>
  <text x="230" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Root Name Server</text>
  <text x="230" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">RNS</text>
  <path d="M230,350 L230,300" stroke="#c0392b" stroke-width="3" marker-end="url(#a7red)"/>

  <defs>
    <marker id="a7red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/></marker>
    <marker id="a7blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e86c1"/></marker>
  </defs>
</svg>
