<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="340" fill="#ffffff"/>

  <rect x="30" y="130" width="100" height="70" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="170" text-anchor="middle" font-size="12">1. Client</text>
  <text x="30" y="225" font-size="11">9. Data in client</text>

  <rect x="290" y="110" width="90" height="120" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="335" y="100" text-anchor="middle" font-size="11">3. Application</text>
  <text x="335" y="88" text-anchor="middle" font-size="11">server</text>
  <text x="290" y="250" font-size="11">7. Data in</text>
  <text x="290" y="263" font-size="11">application server</text>

  <text x="150" y="110" font-size="11">2. Send data from</text>
  <text x="150" y="123" font-size="11">client to app server</text>
  <path d="M130,150 L290,150" stroke="#333" stroke-width="1.5" marker-end="url(#a22)"/>

  <text x="150" y="185" font-size="11">8. Return data from</text>
  <text x="150" y="198" font-size="11">app server to client</text>
  <path d="M290,195 L130,195" stroke="#333" stroke-width="1.5" marker-end="url(#a22)"/>

  <ellipse cx="600" cy="170" rx="50" ry="60" fill="none" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="600" cy="140" rx="50" ry="12" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="105" text-anchor="middle" font-size="11">5. Database</text>
  <text x="580" y="245" font-size="10">Tuning here is</text>
  <text x="580" y="258" font-size="10">not enough</text>

  <text x="410" y="105" font-size="11">4. Send data from</text>
  <text x="410" y="118" font-size="11">app server to database</text>
  <path d="M380,140 L550,140" stroke="#333" stroke-width="1.5" marker-end="url(#a22)"/>
  <path d="M550,155 L380,155" stroke="#333" stroke-width="1.5" marker-end="url(#a22)"/>
  <path d="M380,170 L550,170" stroke="#333" stroke-width="1.5" marker-end="url(#a22)"/>
  <text x="415" y="200" font-size="11">6. Return data from</text>
  <text x="415" y="213" font-size="11">database to app server</text>

  <defs>
    <marker id="a22" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
  </defs>
</svg>
