<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="40" y="30" font-size="13" fill="#000">(1) User issues URL from a browser</text>
  <text x="40" y="48" font-size="11" fill="#2471a3">http://host:port/path/file</text>
  <rect x="70" y="70" width="90" height="70" fill="none" stroke="#2471a3" stroke-width="1.5"/>
  <text x="115" y="160" text-anchor="middle" font-size="12">Client (Browser)</text>

  <text x="330" y="30" font-size="12">(2) Browser sends a request message</text>
  <rect x="290" y="45" width="220" height="80" rx="10" fill="#eef3f9" stroke="#8ea9c1"/>
  <text x="305" y="65" font-size="11" font-family="monospace">GET URL HTTP/1.1</text>
  <text x="305" y="80" font-size="11" font-family="monospace">Host: host:port</text>
  <text x="305" y="95" font-size="10" font-family="monospace">................</text>

  <text x="320" y="150" font-size="12">(4) Server returns a response message</text>
  <rect x="290" y="165" width="220" height="80" rx="10" fill="#eef3f9" stroke="#8ea9c1"/>
  <text x="305" y="185" font-size="11" font-family="monospace">HTTP/1.1 200 OK</text>
  <text x="305" y="200" font-size="10" font-family="monospace">................</text>

  <text x="580" y="160" text-anchor="middle" font-size="12">HTTP (Over TCP/IP)</text>

  <text x="720" y="30" font-size="12">(3) Server maps the URL to a</text>
  <text x="720" y="45" font-size="12">file or program under the</text>
  <text x="720" y="60" font-size="12">document directory.</text>
  <rect x="700" y="70" width="150" height="80" fill="none" stroke="#2471a3" stroke-width="1.5"/>
  <text x="775" y="165" text-anchor="middle" font-size="12">Server (@ host:port)</text>

  <path d="M160,90 L290,80" stroke="#000" stroke-width="1.5" marker-end="url(#a13)"/>
  <path d="M510,90 L700,100" stroke="#000" stroke-width="1.5" marker-end="url(#a13)"/>
  <path d="M700,130 L510,200" stroke="#000" stroke-width="1.5" marker-end="url(#a13)"/>
  <path d="M290,210 L160,120" stroke="#000" stroke-width="1.5" marker-end="url(#a13)"/>

  <text x="40" y="210" font-size="12">(5) Browser formats the response</text>
  <text x="40" y="225" font-size="12">and displays</text>

  <defs>
    <marker id="a13" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
  </defs>
</svg>
