<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="80" y="35" font-size="22" font-weight="bold">SSL (<tspan fill="#c0392b">HTTPS</tspan>)</text>

  <g font-size="13">
    <text x="40" y="80">&#8226; Client say Hello</text>
    <text x="40" y="105">&#8226; Server says Hello (do you have cert)</text>
    <text x="40" y="130">&#8226; Client generated symmetric key</text>
    <text x="40" y="155">&#8226; Server verify the key</text>
    <text x="40" y="180">&#8226; Once verification is successful</text>
    <text x="40" y="205">&#8226; Secure data transfer</text>
  </g>

  <rect x="470" y="60" width="40" height="55" fill="#2e2e2e"/>
  <text x="490" y="130" text-anchor="middle" font-size="11">Server</text>
  <rect x="680" y="60" width="60" height="45" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <text x="710" y="130" text-anchor="middle" font-size="11">Client</text>

  <path d="M680,90 L520,90" stroke="#2471a3" stroke-width="3" marker-end="url(#a20)"/>
  <text x="560" y="80" font-size="10">1 Request to server</text>

  <path d="M520,150 L680,150" stroke="#1e8449" stroke-width="3" marker-end="url(#a20)"/>
  <text x="540" y="140" font-size="10">2 Answer with certificate</text>

  <text x="560" y="190" font-size="10">3 Verification: validation, trust, integrity,</text>
  <text x="560" y="203" font-size="10">integrity with domain name</text>

  <path d="M680,240 L520,240" stroke="#e67e22" stroke-width="3" marker-end="url(#a20)"/>
  <text x="530" y="230" font-size="10">5 Client identification</text>
  <text x="530" y="255" font-size="9">encrypted symmetric SSL key</text>

  <text x="560" y="275" font-size="10">4 Generating symmetric key</text>

  <text x="490" y="300" font-size="10">6 Verification and encryption</text>
  <text x="490" y="313" font-size="10">of symmetric key</text>

  <path d="M520,350 L680,350" stroke="#1e8449" stroke-width="3" marker-end="url(#a20)"/>
  <path d="M680,350 L520,350" stroke="#1e8449" stroke-width="3" marker-start="url(#a20)"/>
  <text x="530" y="340" font-size="10">7 Symmetric encryption</text>
  <text x="560" y="365" font-size="10" fill="#1e8449">Secure data transfer</text>

  <defs>
    <marker id="a20" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000"/></marker>
  </defs>
</svg>
