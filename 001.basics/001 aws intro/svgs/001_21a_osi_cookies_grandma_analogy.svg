<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold">Analogy of picking up cookies from grandma's house</text>
  <text x="40" y="55" font-size="12">1. IP would be the road on which we drive</text>
  <text x="40" y="72" font-size="12">2. TCP would be the car</text>
  <text x="40" y="89" font-size="12">3. And HTTP would be the box of cookies moving from one location to another</text>

  <g font-size="11">
    <rect x="30" y="110" width="230" height="42" fill="#f2c8c2" stroke="#333"/><text x="40" y="130">APPLICATION LAYER</text><text x="40" y="145" font-size="9">DHCP, DNS, HTTP, HTTPS, TLS/SSL</text>
    <rect x="30" y="152" width="230" height="42" fill="#fbe6c0" stroke="#333"/><text x="40" y="172">TRANSPORT LAYER</text><text x="40" y="187" font-size="9">TCP, UDP</text>
    <rect x="30" y="194" width="230" height="42" fill="#d7ecd4" stroke="#333"/><text x="40" y="214">INTERNET LAYER</text><text x="40" y="229" font-size="9">IP</text>
    <rect x="30" y="236" width="230" height="42" fill="#cfe0f0" stroke="#333"/><text x="40" y="256">NETWORK/LINK LAYER</text><text x="40" y="271" font-size="9">ETHERNET</text>
  </g>

  <text x="580" y="105" text-anchor="middle" font-size="12">Server/grandma's</text>
  <rect x="560" y="115" width="40" height="35" fill="#c0392b"/>
  <polygon points="555,115 580,95 605,115" fill="#7b241c"/>

  <rect x="470" y="270" width="40" height="35" fill="#2e86c1"/>
  <polygon points="465,270 490,250 515,270" fill="#1a5276"/>
  <text x="490" y="315" text-anchor="middle" font-size="12">Client</text>

  <text x="540" y="190" font-size="10" fill="#333">(GET request) TCP</text>
  <text x="560" y="215" font-size="10" fill="#333">IP</text>
  <text x="600" y="235" font-size="10" fill="#333">TCP</text>
  <circle cx="640" cy="255" r="18" fill="#e59866"/>
  <text x="640" y="260" text-anchor="middle" font-size="9">HTTP</text>

  <path d="M510,265 L560,150" stroke="#333" stroke-width="1.2" fill="none"/>
  <path d="M515,285 L565,165" stroke="#333" stroke-width="1.2" fill="none"/>
</svg>
