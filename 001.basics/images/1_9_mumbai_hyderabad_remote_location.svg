<svg height="360" width="860" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="860" height="360" fill="#f8fafc" rx="12"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Cloud Computing: Connecting to Remote Locations (AWS Regions)</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#64748b">Client connects over High-Speed Internet to AWS Mumbai &amp; Hyderabad Regions</text>

  <!-- Client -->
  <g transform="translate(50, 110)">
    <rect width="160" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="160" height="30" rx="8" fill="#dbeafe"/>
    <text x="80" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Local Client</text>
    <text x="80" y="65" text-anchor="middle" font-size="12" fill="#475569">Developer / User</text>
    <rect x="15" y="80" width="130" height="26" rx="4" fill="#eff6ff"/>
    <text x="80" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">AWS Console / CLI</text>
    <text x="80" y="130" text-anchor="middle" font-size="10" fill="#64748b">Connected via Internet</text>
  </g>

  <!-- Cloud 1: Mumbai (ap-south-1) -->
  <g transform="translate(580, 75)">
    <rect width="230" height="105" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="230" height="26" rx="10" fill="#dcfce7"/>
    <text x="115" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">AWS Mumbai (ap-south-1)</text>
    <text x="115" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Remote Location #1</text>
    <text x="115" y="70" text-anchor="middle" font-size="11" fill="#16a34a">✓ Mature &amp; Stable (3 AZs)</text>
    <text x="115" y="88" text-anchor="middle" font-size="10" fill="#64748b">Datacenters, EC2, S3, RDS</text>
  </g>

  <!-- Cloud 2: Hyderabad (ap-south-2) -->
  <g transform="translate(580, 205)">
    <rect width="230" height="105" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="230" height="26" rx="10" fill="#fef3c7"/>
    <text x="115" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">AWS Hyderabad (ap-south-2)</text>
    <text x="115" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Remote Location #2</text>
    <text x="115" y="70" text-anchor="middle" font-size="11" fill="#d97706">Newer Infra (3 AZs)</text>
    <text x="115" y="88" text-anchor="middle" font-size="10" fill="#64748b">Datacenters, EC2, VPC</text>
  </g>

  <!-- Internet Conduit with animated flows -->
  <path d="M 215 170 C 350 170, 420 125, 570 125" class="flow-green" marker-end="url(#arr-green)"/>
  <path d="M 215 200 C 350 200, 420 255, 570 255" class="flow-amber" marker-end="url(#arr-amber)"/>

  <!-- Internet Badge -->
  <g transform="translate(330, 160)">
    <rect width="120" height="40" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">&#127760; Internet</text>
  </g>
</svg>