<svg height="460" width="940" viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="940" height="460" fill="#f8fafc" rx="12"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Public Cloud Model (AWS / Azure / GCP)</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#64748b">Shared multi-tenant infrastructure accessible over the public internet</text>

  <!-- Left: Users -->
  <g transform="translate(40, 95)">
    <rect width="140" height="320" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">General Public</text>

    <rect x="15" y="40" width="110" height="45" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">User A</text>
    <path d="M 185 157 L 275 140" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="105" width="110" height="45" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">User B</text>
    <path d="M 185 222 L 275 200" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="170" width="110" height="45" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">User C</text>
    <path d="M 185 287 L 275 260" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="235" width="110" height="45" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">User D</text>
    <path d="M 185 352 L 275 320" class="flow-blue" marker-end="url(#arr-blue)"/>

  </g>

  <!-- Center: Public Cloud Boundary -->
  <g transform="translate(280, 85)">
    <rect width="380" height="340" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="380" height="35" rx="14" fill="#dbeafe"/>
    <text x="190" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">&#9729; Public Cloud Platform (AWS)</text>

    <!-- Services Grid -->
    <g transform="translate(25, 50)">
      <rect width="150" height="55" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="75" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Compute Services</text>
      <text x="75" y="42" text-anchor="middle" font-size="10" fill="#64748b">EC2, Lambda, ECS</text>

      <rect x="180" y="0" width="150" height="55" rx="6" fill="#fdf4ff" stroke="#f0abfc"/>
      <text x="255" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#a21caf">Storage Services</text>
      <text x="255" y="42" text-anchor="middle" font-size="10" fill="#64748b">S3, EBS, EFS</text>

      <rect x="0" y="70" width="150" height="55" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
      <text x="75" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">Database Services</text>
      <text x="75" y="112" text-anchor="middle" font-size="10" fill="#64748b">RDS, DynamoDB</text>

      <rect x="180" y="70" width="150" height="55" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="255" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Messaging Services</text>
      <text x="255" y="112" text-anchor="middle" font-size="10" fill="#64748b">SQS, SNS, EventBridge</text>

      <rect x="0" y="140" width="330" height="55" rx="6" fill="#f0fdf4" stroke="#86efac"/>
      <text x="165" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Platform &amp; Networking Services</text>
      <text x="165" y="182" text-anchor="middle" font-size="10" fill="#64748b">VPC, Route53, ELB, CloudFront</text>
    </g>

    <!-- Cloud Admin -->
    <rect x="25" y="265" width="330" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="165" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">&#128100; Cloud Provider Managed (AWS)</text>
    <text x="165" y="302" text-anchor="middle" font-size="10" fill="#64748b">Handles hardware, datacenters, cooling &amp; virtualization</text>
  </g>

  <!-- Right: Benefits &amp; Disadvantages -->
  <g transform="translate(690, 85)">
    <!-- Benefits -->
    <rect width="210" height="155" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="210" height="26" rx="8" fill="#dcfce7"/>
    <text x="105" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">✓ BENEFITS</text>
    <g font-size="11" fill="#334155" transform="translate(15, 38)">
      <text y="15">• Highly cost effective</text>
      <text y="33">• Utility-style pricing</text>
      <text y="51">• High scalability on demand</text>
      <text y="69">• Location independence</text>
      <text y="87">• High availability &amp; SLA</text>
    </g>

    <!-- Drawbacks -->
    <rect y="175" width="210" height="150" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect y="175" width="210" height="26" rx="8" fill="#fee2e2"/>
    <text x="105" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">&#9888; DISADVANTAGES</text>
    <g font-size="11" fill="#334155" transform="translate(15, 212)">
      <text y="15">• Multi-tenant security</text>
      <text y="33">• Less hardware control</text>
      <text y="51">• Compliance boundaries</text>
      <text y="69">• Internet latency variance</text>
    </g>
  </g>
</svg>