<svg height="480" width="960" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" rx="12"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Comparison: IaaS vs. PaaS vs. SaaS Shared Responsibility</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">How control shifts from you to the cloud provider across service models</text>

  <!-- 3 Columns: IaaS, PaaS, SaaS -->
  <!-- IaaS Column -->
  <g transform="translate(60, 90)">
    <rect width="250" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="250" height="32" rx="10" fill="#dbeafe"/>
    <text x="125" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">IaaS (e.g. AWS EC2)</text>
    
    <g font-size="11">
      <rect x="15" y="45" width="220" height="28" rx="4" fill="#dbeafe"/>
      <text x="125" y="63" text-anchor="middle" font-weight="bold" fill="#1e40af">You Manage: Applications</text>

      <rect x="15" y="80" width="220" height="28" rx="4" fill="#dbeafe"/>
      <text x="125" y="98" text-anchor="middle" font-weight="bold" fill="#1e40af">You Manage: Data</text>

      <rect x="15" y="115" width="220" height="28" rx="4" fill="#dbeafe"/>
      <text x="125" y="133" text-anchor="middle" font-weight="bold" fill="#1e40af">You Manage: OS &amp; Patches</text>

      <rect x="15" y="150" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="168" text-anchor="middle" fill="#166534">AWS: Virtualization</text>

      <rect x="15" y="185" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="203" text-anchor="middle" fill="#166534">AWS: Servers</text>

      <rect x="15" y="220" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="238" text-anchor="middle" fill="#166534">AWS: Storage</text>

      <rect x="15" y="255" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="273" text-anchor="middle" fill="#166534">AWS: Networking</text>
    </g>
    <text x="125" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Highest Control</text>
  </g>

  <!-- PaaS Column -->
  <g transform="translate(355, 90)">
    <rect width="250" height="340" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="250" height="32" rx="10" fill="#f3e8ff"/>
    <text x="125" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">PaaS (e.g. Elastic Beanstalk)</text>
    
    <g font-size="11">
      <rect x="15" y="45" width="220" height="28" rx="4" fill="#f3e8ff"/>
      <text x="125" y="63" text-anchor="middle" font-weight="bold" fill="#7e22ce">You Manage: Applications</text>

      <rect x="15" y="80" width="220" height="28" rx="4" fill="#f3e8ff"/>
      <text x="125" y="98" text-anchor="middle" font-weight="bold" fill="#7e22ce">You Manage: Data</text>

      <rect x="15" y="115" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="133" text-anchor="middle" fill="#166534">AWS: OS &amp; Runtime</text>

      <rect x="15" y="150" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="168" text-anchor="middle" fill="#166534">AWS: Virtualization</text>

      <rect x="15" y="185" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="203" text-anchor="middle" fill="#166534">AWS: Servers</text>

      <rect x="15" y="220" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="238" text-anchor="middle" fill="#166534">AWS: Storage</text>

      <rect x="15" y="255" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="273" text-anchor="middle" fill="#166534">AWS: Networking</text>
    </g>
    <text x="125" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#9333ea">Balanced Speed &amp; Ease</text>
  </g>

  <!-- SaaS Column -->
  <g transform="translate(650, 90)">
    <rect width="250" height="340" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="250" height="32" rx="10" fill="#dcfce7"/>
    <text x="125" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">SaaS (e.g. Gmail / M365)</text>
    
    <g font-size="11">
      <rect x="15" y="45" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="63" text-anchor="middle" fill="#166534">Provider: Applications</text>

      <rect x="15" y="80" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="98" text-anchor="middle" fill="#166534">Provider: Data Storage</text>

      <rect x="15" y="115" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="133" text-anchor="middle" fill="#166534">Provider: OS &amp; Runtime</text>

      <rect x="15" y="150" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="168" text-anchor="middle" fill="#166534">Provider: Virtualization</text>

      <rect x="15" y="185" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="203" text-anchor="middle" fill="#166534">Provider: Servers</text>

      <rect x="15" y="220" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="238" text-anchor="middle" fill="#166534">Provider: Storage</text>

      <rect x="15" y="255" width="220" height="28" rx="4" fill="#dcfce7"/>
      <text x="125" y="273" text-anchor="middle" fill="#166534">Provider: Networking</text>
    </g>
    <text x="125" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">Zero Maintenance</text>
  </g>
</svg>