<svg height="500" width="940" viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="940" height="500" fill="#f8fafc" rx="12"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SSL / TLS (HTTPS) Handshake Sequence Flow</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#64748b">Step-by-step cryptographic exchange establishing an encrypted session</text>

  <!-- Left: Client Column -->
  <g transform="translate(140, 80)">
    <rect width="160" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Client (Browser)</text>
    <text x="80" y="42" text-anchor="middle" font-size="11" fill="#64748b">Requests Secure Session</text>
    <!-- Lifeline -->
    <line x1="80" y1="50" x2="80" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Right: Server Column -->
  <g transform="translate(640, 80)">
    <rect width="160" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Server (Web Server)</text>
    <text x="80" y="42" text-anchor="middle" font-size="11" fill="#64748b">Holds SSL Certificate &amp; Key</text>
    <!-- Lifeline -->
    <line x1="80" y1="50" x2="80" y2="380" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Sequence Steps with Animated Arrows -->
  <!-- Step 1: ClientHello -->
  <path d="M 220 155 L 720 155" class="flow-blue" marker-end="url(#arr-blue)"/>
  <rect x="360" y="135" width="220" height="24" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="470" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">1. ClientHello (TLS Version, Cipher Suites)</text>

  <!-- Step 2: ServerHello + Certificate -->
  <path d="M 720 205 L 220 205" class="flow-green" marker-end="url(#arr-green)"/>
  <rect x="340" y="185" width="260" height="24" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="470" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">2. ServerHello + SSL Certificate + Public Key</text>

  <!-- Step 3: Verification (Client Box) -->
  <rect x="150" y="230" width="140" height="28" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="220" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">✓ 3. Validates CA Cert</text>

  <!-- Step 4: Pre-Master Secret Encrypted with Server's Public Key -->
  <path d="M 220 285 L 720 285" class="flow-purple" marker-end="url(#arr-purple)"/>
  <rect x="330" y="265" width="280" height="24" rx="4" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="470" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">4. Client sends Pre-Master Key (Encrypted via PubKey)</text>

  <!-- Step 5: Server Decrypts Key -->
  <rect x="650" y="310" width="140" height="28" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="720" y="328" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">✓ 5. Decrypts with PrivKey</text>

  <!-- Step 6: Session Established / Bidirectional Encrypted Data -->
  <path d="M 220 375 L 720 375" class="flow-green" marker-end="url(#arr-green)"/>
  <path d="M 720 395 L 220 395" class="flow-green" marker-end="url(#arr-green)"/>
  <rect x="320" y="365" width="300" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">&#128274; 6. Symmetric Encrypted Session Established</text>
  <text x="470" y="396" text-anchor="middle" font-size="10" fill="#166534">Fast symmetric encryption (AES-GCM) protects all HTTP traffic</text>

  <!-- Footer -->
  <rect x="220" y="445" width="500" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="470" y="466" text-anchor="middle" font-size="12" fill="#475569">SSL Certificates are purchased from CAs (e.g. GoDaddy, DigiCert) or issued by AWS ACM.</text>
</svg>