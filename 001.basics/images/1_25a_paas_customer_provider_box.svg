<svg height="380" width="780" viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="780" height="380" fill="#f8fafc" rx="12"/>
  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">PaaS Shared Responsibility (e.g. AWS Elastic Beanstalk)</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#64748b">Customer manages Application &amp; Data • Cloud Provider manages OS, Servers &amp; Network</text>

  <!-- Stack Box -->
  <g transform="translate(120, 90)">
    <!-- Customer Scope -->
    <rect width="540" height="110" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
    <text x="270" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">&#128100; CUSTOMER RESPONSIBILITY</text>
    
    <rect x="25" y="38" width="490" height="28" rx="4" fill="#ffffff" stroke="#f0abfc"/>
    <text x="270" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#a21caf">Application Code (Java, Python, Node.js, Go, .NET)</text>

    <rect x="25" y="72" width="490" height="28" rx="4" fill="#ffffff" stroke="#f0abfc"/>
    <text x="270" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#a21caf">Customer Data &amp; Business Rules</text>

    <!-- Provider Scope -->
    <g transform="translate(0, 125)">
      <rect width="540" height="135" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
      <text x="270" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">&#9729; CLOUD PROVIDER RESPONSIBILITY (PaaS Engine)</text>
      
      <rect x="25" y="35" width="490" height="25" rx="4" fill="#ffffff" stroke="#86efac"/>
      <text x="270" y="52" text-anchor="middle" font-size="11" fill="#166534">Operating System &amp; Runtime Patches (Managed by AWS)</text>

      <rect x="25" y="66" width="490" height="25" rx="4" fill="#ffffff" stroke="#86efac"/>
      <text x="270" y="83" text-anchor="middle" font-size="11" fill="#166534">Virtual Servers &amp; Hypervisor Scaling (EC2 underlying)</text>

      <rect x="25" y="97" width="490" height="25" rx="4" fill="#ffffff" stroke="#86efac"/>
      <text x="270" y="114" text-anchor="middle" font-size="11" fill="#166534">Physical Facilities, Datacenter Power &amp; Network</text>
    </g>
  </g>
</svg>