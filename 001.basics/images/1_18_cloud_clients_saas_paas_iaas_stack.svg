<svg height="460" width="840" viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="840" height="460" fill="#f8fafc" rx="12"/>
  <text x="420" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Cloud Clients &amp; Service Model Hierarchy</text>
  <text x="420" y="60" text-anchor="middle" font-size="13" fill="#64748b">Client devices interacting with SaaS, PaaS, and IaaS layers</text>

  <!-- Top: Clients Row -->
  <g transform="translate(120, 85)">
    <rect width="600" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="300" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">CLOUD CLIENTS</text>
    
    <rect x="30" y="32" width="150" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="105" y="51" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">&#128187; Web Browser</text>

    <rect x="225" y="32" width="150" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="300" y="51" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">&#128241; Mobile App</text>

    <rect x="420" y="32" width="150" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="495" y="51" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">&#9881; CLI / Thin Client</text>
  </g>

  <!-- Downward animated flow arrows -->
  <path d="M 420 160 L 420 185" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Service Stacks -->
  <!-- 1. SaaS Layer -->
  <g transform="translate(120, 190)">
    <rect width="600" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="600" height="20" rx="8" fill="#dcfce7"/>
    <text x="100" y="15" font-size="11" font-weight="bold" fill="#166534">SaaS (Software as a Service)</text>
    <text x="100" y="45" font-size="12" fill="#475569">End-User Applications: Gmail, Microsoft 365, Salesforce, Zoom, Dropbox</text>
  </g>

  <path d="M 420 255 L 420 275" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- 2. PaaS Layer -->
  <g transform="translate(120, 280)">
    <rect width="600" height="60" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="600" height="20" rx="8" fill="#f3e8ff"/>
    <text x="100" y="15" font-size="11" font-weight="bold" fill="#7e22ce">PaaS (Platform as a Service)</text>
    <text x="100" y="45" font-size="12" fill="#475569">Developer Environment: AWS Elastic Beanstalk, Lambda, Google App Engine</text>
  </g>

  <path d="M 420 345 L 420 365" class="flow-amber" marker-end="url(#arr-amber)"/>

  <!-- 3. IaaS Layer -->
  <g transform="translate(120, 370)">
    <rect width="600" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="600" height="20" rx="8" fill="#fef3c7"/>
    <text x="100" y="15" font-size="11" font-weight="bold" fill="#92400e">IaaS (Infrastructure as a Service)</text>
    <text x="100" y="45" font-size="12" fill="#475569">Fundamental Resources: AWS EC2, S3, VPC, Azure VMs, Compute Engine</text>
  </g>
</svg>