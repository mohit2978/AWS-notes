<svg height="460" width="920" viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#f8fafc" rx="12"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Firewall → 3×3 Tiered Server Grid (Google)</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#64748b">Verified traffic reaches Web Tier → Application Tier → Database Tier</text>

  <!-- External Traffic Arrow -->
  <path d="M 30 230 L 95 230" class="flow-blue" marker-end="url(#arr-blue)"/>
  <text x="60" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">HTTPS Traffic</text>

  <!-- Firewall Column -->
  <g transform="translate(100, 80)">
    <rect width="110" height="310" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="110" height="30" rx="8" fill="#fee2e2"/>
    <text x="55" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">FIREWALL</text>
    
    <rect x="10" y="45" width="90" height="45" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="55" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">✓ Allow 443</text>
    <text x="55" y="80" text-anchor="middle" font-size="9" fill="#166534">HTTPS Only</text>

    <rect x="10" y="105" width="90" height="45" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="55" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny 80</text>
    <text x="55" y="140" text-anchor="middle" font-size="9" fill="#991b1b">Plain HTTP</text>

    <rect x="10" y="165" width="90" height="45" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="55" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny 22</text>
    <text x="55" y="200" text-anchor="middle" font-size="9" fill="#991b1b">SSH Admin</text>

    <rect x="10" y="225" width="90" height="45" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="55" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny 3389</text>
    <text x="55" y="260" text-anchor="middle" font-size="9" fill="#991b1b">Windows RDP</text>
  </g>

  <!-- 3x3 Grid (Rows: Row 1, Row 2, Row 3) -->
  <!-- Column Headers -->
  <text x="320" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Web Server Tier</text>
  <text x="540" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#9333ea">App Server Tier</text>
  <text x="760" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">Database Tier</text>

  <!-- Row 1 -->
  <!-- Web Server -->
  <rect x="260" y="120" width="120" height="65" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Web #1</text>
  <text x="320" y="168" text-anchor="middle" font-size="10" fill="#64748b">Nginx / Port 443</text>

  <!-- Arrow Web -> App -->
  <path d="M 385 152 L 475 152" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server -->
  <rect x="480" y="120" width="120" height="65" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="540" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">App #1</text>
  <text x="540" y="168" text-anchor="middle" font-size="10" fill="#64748b">Tomcat:8080</text>

  <!-- Arrow App -> DB -->
  <path d="M 605 152 L 695 152" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- DB Server -->
  <rect x="700" y="120" width="120" height="65" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DB #1</text>
  <text x="760" y="168" text-anchor="middle" font-size="10" fill="#64748b">MySQL / Aurora</text>

  <!-- Flow from Firewall to Web Server -->
  <path d="M 215 152 L 255 152" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Row 2 -->
  <!-- Web Server -->
  <rect x="260" y="210" width="120" height="65" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Web #2</text>
  <text x="320" y="258" text-anchor="middle" font-size="10" fill="#64748b">Nginx / Port 443</text>

  <!-- Arrow Web -> App -->
  <path d="M 385 242 L 475 242" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server -->
  <rect x="480" y="210" width="120" height="65" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="540" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">App #2</text>
  <text x="540" y="258" text-anchor="middle" font-size="10" fill="#64748b">Tomcat:8080</text>

  <!-- Arrow App -> DB -->
  <path d="M 605 242 L 695 242" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- DB Server -->
  <rect x="700" y="210" width="120" height="65" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DB #2</text>
  <text x="760" y="258" text-anchor="middle" font-size="10" fill="#64748b">MySQL / Aurora</text>

  <!-- Flow from Firewall to Web Server -->
  <path d="M 215 242 L 255 242" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Row 3 -->
  <!-- Web Server -->
  <rect x="260" y="300" width="120" height="65" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Web #3</text>
  <text x="320" y="348" text-anchor="middle" font-size="10" fill="#64748b">Nginx / Port 443</text>

  <!-- Arrow Web -> App -->
  <path d="M 385 332 L 475 332" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server -->
  <rect x="480" y="300" width="120" height="65" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="540" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">App #3</text>
  <text x="540" y="348" text-anchor="middle" font-size="10" fill="#64748b">Tomcat:8080</text>

  <!-- Arrow App -> DB -->
  <path d="M 605 332 L 695 332" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- DB Server -->
  <rect x="700" y="300" width="120" height="65" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DB #3</text>
  <text x="760" y="348" text-anchor="middle" font-size="10" fill="#64748b">MySQL / Aurora</text>

  <!-- Flow from Firewall to Web Server -->
  <path d="M 215 332 L 255 332" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="260" y="405" width="400" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="460" y="426" text-anchor="middle" font-size="12" fill="#475569">Only allowed HTTPS packets pass the firewall into the server farm.</text>
</svg>