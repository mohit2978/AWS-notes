<svg height="480" width="960" viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#f8fafc" rx="12"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Firewall + Load Balancer + Tiered Server Grid (Google)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">Verified HTTPS traffic routed via Load Balancer across Web, App &amp; DB servers</text>

  <!-- External Traffic Arrow -->
  <path d="M 25 240 L 75 240" class="flow-blue" marker-end="url(#arr-blue)"/>
  <text x="50" y="225" text-anchor="middle" font-size="9" font-weight="bold" fill="#2563eb">HTTPS</text>

  <!-- Firewall -->
  <g transform="translate(80, 90)">
    <rect width="90" height="300" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="90" height="30" rx="8" fill="#fee2e2"/>
    <text x="45" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">FIREWALL</text>
    <rect x="8" y="45" width="74" height="40" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="45" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">✓ Allow 443</text>
    <rect x="8" y="95" width="74" height="40" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="45" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny 80</text>
    <rect x="8" y="145" width="74" height="40" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="45" y="165" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny 22</text>
    <text x="45" y="240" text-anchor="middle" font-size="10" fill="#64748b">Perimeter</text>
    <text x="45" y="255" text-anchor="middle" font-size="10" fill="#64748b">Security</text>
  </g>

  <!-- Arrow Firewall -> Load Balancer -->
  <path d="M 175 240 L 225 240" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- Load Balancer -->
  <g transform="translate(230, 90)">
    <rect width="90" height="300" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="90" height="30" rx="8" fill="#fef3c7"/>
    <text x="45" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">LOAD BALANCER</text>
    <text x="45" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Public Host</text>
    <text x="45" y="82" text-anchor="middle" font-size="10" fill="#d97706">google.com</text>
    <rect x="8" y="110" width="74" height="45" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="45" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Round</text>
    <text x="45" y="145" text-anchor="middle" font-size="10" fill="#16a34a">Robin</text>
    <text x="45" y="220" text-anchor="middle" font-size="10" fill="#64748b">Health</text>
    <text x="45" y="235" text-anchor="middle" font-size="10" fill="#64748b">Checks</text>
    <text x="45" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Port 443 → 80</text>
  </g>

  <!-- 3x3 Server Grid -->
  <text x="420" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Web Server Tier</text>
  <text x="610" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#9333ea">App Server Tier</text>
  <text x="800" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">Database Tier</text>

  <!-- LB to Web Server 1 -->
  <path d="M 325 240 C 340 240, 345 150, 365 150" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Web Server 1 -->
  <rect x="370" y="120" width="105" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="422" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Web #1</text>
  <text x="422" y="164" text-anchor="middle" font-size="10" fill="#64748b">Nginx</text>

  <!-- Web -> App -->
  <path d="M 480 150 L 550 150" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server 1 -->
  <rect x="555" y="120" width="105" height="60" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="607" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">App #1</text>
  <text x="607" y="164" text-anchor="middle" font-size="10" fill="#64748b">Tomcat:8080</text>

  <!-- App -> DB -->
  <path d="M 665 150 L 740 150" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- DB Server 1 -->
  <rect x="745" y="120" width="105" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="797" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DB #1</text>
  <text x="797" y="164" text-anchor="middle" font-size="10" fill="#64748b">MySQL / Aurora</text>

  <!-- LB to Web Server 2 -->
  <path d="M 325 240 C 340 240, 345 240, 365 240" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Web Server 2 -->
  <rect x="370" y="210" width="105" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="422" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Web #2</text>
  <text x="422" y="254" text-anchor="middle" font-size="10" fill="#64748b">Nginx</text>

  <!-- Web -> App -->
  <path d="M 480 240 L 550 240" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server 2 -->
  <rect x="555" y="210" width="105" height="60" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="607" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">App #2</text>
  <text x="607" y="254" text-anchor="middle" font-size="10" fill="#64748b">Tomcat:8080</text>

  <!-- App -> DB -->
  <path d="M 665 240 L 740 240" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- DB Server 2 -->
  <rect x="745" y="210" width="105" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="797" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DB #2</text>
  <text x="797" y="254" text-anchor="middle" font-size="10" fill="#64748b">MySQL / Aurora</text>

  <!-- LB to Web Server 3 -->
  <path d="M 325 240 C 340 240, 345 330, 365 330" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Web Server 3 -->
  <rect x="370" y="300" width="105" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="422" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Web #3</text>
  <text x="422" y="344" text-anchor="middle" font-size="10" fill="#64748b">Nginx</text>

  <!-- Web -> App -->
  <path d="M 480 330 L 550 330" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server 3 -->
  <rect x="555" y="300" width="105" height="60" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="607" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">App #3</text>
  <text x="607" y="344" text-anchor="middle" font-size="10" fill="#64748b">Tomcat:8080</text>

  <!-- App -> DB -->
  <path d="M 665 330 L 740 330" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- DB Server 3 -->
  <rect x="745" y="300" width="105" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="797" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">DB #3</text>
  <text x="797" y="344" text-anchor="middle" font-size="10" fill="#64748b">MySQL / Aurora</text>

  <rect x="230" y="420" width="500" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="441" text-anchor="middle" font-size="12" fill="#475569">Troubleshooting sequence when site fails: Check Firewall → Load Balancer → Servers.</text>
</svg>