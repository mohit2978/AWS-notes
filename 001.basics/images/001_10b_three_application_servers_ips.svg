<svg height="420" width="860" viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#f8fafc" rx="16"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Direct IP Addressing to Multiple Application Servers</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#64748b">Client Shashank requests specific backend servers by their unique individual IP addresses</text>

  <!-- Left: Client Card (Shashank) -->
  <g transform="translate(40, 110)">
    <rect width="260" height="210" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="260" height="32" rx="12" fill="#2563eb"/>
    <text x="130" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Client (Shashank's Browser)</text>
    
    <g transform="translate(20, 48)">
      <rect width="220" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="bold" fill="#2563eb">REQUEST 1:</text>
      <text x="10" y="32" font-size="11" font-weight="bold" fill="#1e40af">http://192.168.10.20/index.html</text>
    </g>

    <g transform="translate(20, 98)">
      <rect width="220" height="40" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="bold" fill="#16a34a">REQUEST 2:</text>
      <text x="10" y="32" font-size="11" font-weight="bold" fill="#15803d">http://192.168.10.21/index.html</text>
    </g>

    <g transform="translate(20, 148)">
      <rect width="220" height="40" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="bold" fill="#9333ea">REQUEST 3:</text>
      <text x="10" y="32" font-size="11" font-weight="bold" fill="#7e22ce">http://192.168.10.22/index.html</text>
    </g>
  </g>

  <!-- Flow Lines to 3 Servers -->
  <path d="M 300,178 C 400,178 440,115 520,115" class="flow-blue" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 300,215 L 520,215" class="flow-green" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 300,252 C 400,252 440,315 520,315" class="flow-purple" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- Right: 3 Application Servers -->
  <!-- Server 1 -->
  <g transform="translate(525, 75)">
    <rect width="290" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <rect width="290" height="22" rx="10" fill="#2563eb"/>
    <text x="145" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Application Server 1</text>
    <rect x="15" y="32" width="36" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="33" y="55" text-anchor="middle" font-size="18">🖥️</text>
    <text x="60" y="47" font-size="12" font-weight="bold" fill="#1e40af">IP: 192.168.10.20</text>
    <text x="60" y="63" font-size="10" fill="#64748b">Port 80 / HTTP • Serving index.html</text>
  </g>

  <!-- Server 2 -->
  <g transform="translate(525, 175)">
    <rect width="290" height="80" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <rect width="290" height="22" rx="10" fill="#16a34a"/>
    <text x="145" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Application Server 2</text>
    <rect x="15" y="32" width="36" height="36" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="33" y="55" text-anchor="middle" font-size="18">🖥️</text>
    <text x="60" y="47" font-size="12" font-weight="bold" fill="#15803d">IP: 192.168.10.21</text>
    <text x="60" y="63" font-size="10" fill="#64748b">Port 80 / HTTP • Serving index.html</text>
  </g>

  <!-- Server 3 -->
  <g transform="translate(525, 275)">
    <rect width="290" height="80" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <rect width="290" height="22" rx="10" fill="#9333ea"/>
    <text x="145" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">Application Server 3</text>
    <rect x="15" y="32" width="36" height="36" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="33" y="55" text-anchor="middle" font-size="18">🖥️</text>
    <text x="60" y="47" font-size="12" font-weight="bold" fill="#7e22ce">IP: 192.168.10.22</text>
    <text x="60" y="63" font-size="10" fill="#64748b">Port 80 / HTTP • Serving index.html</text>
  </g>

  <!-- Bottom Note -->
  <rect x="180" y="375" width="500" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="392" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">
    Without a Load Balancer, clients must know and target individual server IP addresses manually
  </text>
</svg>
