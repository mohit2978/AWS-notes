<svg height="420" width="980" viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="980" height="420" fill="#f8fafc" rx="12"/>
  <text x="490" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DNS Resolved → Network Packets → Corporate Firewall</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#64748b">Traffic passes over the internet and is inspected by Security Firewall Allow/Deny rules</text>

  <!-- Client Laptop -->
  <g transform="translate(40, 110)">
    <rect width="150" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="150" height="28" rx="8" fill="#dbeafe"/>
    <text x="75" y="19" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Srinivas's Laptop</text>
    <rect x="15" y="45" width="120" height="25" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="75" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Browser</text>
    <text x="75" y="95" text-anchor="middle" font-size="11" fill="#475569">Resolved IP:</text>
    <rect x="15" y="105" width="120" height="25" rx="4" fill="#ecfdf5" stroke="#86efac"/>
    <text x="75" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">142.250.190.46</text>
  </g>

  <!-- Network Channel with Animated Packets -->
  <g transform="translate(230, 130)">
    <rect width="320" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="160" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Public Internet Network</text>
    
    <!-- Flow line through internet -->
    <path d="M 20 60 L 300 60" class="flow-blue" marker-end="url(#arr-blue)"/>
    
    <!-- Moving Packets -->
    <rect x="50" y="45" width="55" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="77" y="64" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">TCP:443</text>

    <rect x="135" y="45" width="55" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="162" y="64" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">TLS Data</text>

    <rect x="220" y="45" width="55" height="30" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="247" y="64" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">HTTP GET</text>

    <text x="160" y="98" text-anchor="middle" font-size="10" fill="#64748b">Data packets transit ISP routers &amp; backbones</text>
  </g>

  <!-- Connection from Laptop into Internet -->
  <path d="M 195 185 L 225 185" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Connection from Internet into Firewall -->
  <path d="M 555 185 L 615 185" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Corporate Perimeter: Google Company -->
  <g transform="translate(620, 90)">
    <rect width="320" height="270" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <rect width="320" height="35" rx="12" fill="#0f172a"/>
    <text x="160" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Google Company Infrastructure</text>

    <!-- Firewall Sub-Box -->
    <g transform="translate(20, 50)">
      <rect width="130" height="195" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <rect width="130" height="26" rx="8" fill="#fee2e2"/>
      <text x="65" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">&#128737; FIREWALL</text>

      <rect x="15" y="38" width="100" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
      <text x="65" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">✓ Allow HTTPS:443</text>

      <rect x="15" y="78" width="100" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="65" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny HTTP:80</text>

      <rect x="15" y="118" width="100" height="30" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="65" y="137" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">&#10007; Deny SSH:22</text>

      <text x="65" y="175" text-anchor="middle" font-size="10" fill="#64748b">Security Rules</text>
    </g>

    <!-- Internal Protected Web Server -->
    <g transform="translate(170, 75)">
      <rect width="130" height="140" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
      <text x="65" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Internal Network</text>
      
      <rect x="15" y="40" width="100" height="35" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="65" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Web Server</text>
      <text x="65" y="70" text-anchor="middle" font-size="9" fill="#64748b">Port 443 open</text>

      <rect x="15" y="85" width="100" height="35" rx="4" fill="#fdf4ff" stroke="#e879f9"/>
      <text x="65" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#a21caf">App Servers</text>
      <text x="65" y="115" text-anchor="middle" font-size="9" fill="#64748b">Protected</text>
    </g>

    <!-- Arrow through firewall to internal -->
    <path d="M 150 145 L 165 145" class="flow-green" marker-end="url(#arr-green)"/>
  </g>

  <!-- Bottom Banner -->
  <rect x="180" y="375" width="620" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="490" y="396" text-anchor="middle" font-size="12" fill="#475569">Firewall enforces Allow/Deny traffic rules based on IP address, port numbers, and protocol.</text>
</svg>