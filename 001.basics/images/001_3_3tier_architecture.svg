<svg height="500" width="980" viewBox="0 0 980 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="980" height="500" fill="#f8fafc" rx="12"/>
  <text x="490" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">3-Tier Architecture</text>
  <text x="490" y="60" text-anchor="middle" font-size="13" fill="#64748b">Presentation Tier (Web Server) • Application Tier • Database Tier</text>

  <!-- Network Zone Labels -->
  <rect x="220" y="80" width="160" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="300" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">PUBLIC NETWORK</text>

  <rect x="420" y="80" width="520" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="680" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">PRIVATE NETWORK (Secure - No Direct Internet Access)</text>

  <!-- Tier 1: Clients -->
  <g transform="translate(30, 115)">
    <rect width="140" height="340" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Client Tier</text>

    <rect x="15" y="45" width="110" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="65" text-anchor="middle" font-size="11" fill="#1e40af">Client Browser #1</text>
    <path d="M 170 176 L 220 280" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="91" width="110" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="111" text-anchor="middle" font-size="11" fill="#1e40af">Client Browser #2</text>
    <path d="M 170 222 L 220 280" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="137" width="110" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="157" text-anchor="middle" font-size="11" fill="#1e40af">Client Browser #3</text>
    <path d="M 170 268 L 220 280" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="183" width="110" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="203" text-anchor="middle" font-size="11" fill="#1e40af">Client Browser #4</text>
    <path d="M 170 314 L 220 280" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="229" width="110" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="249" text-anchor="middle" font-size="11" fill="#1e40af">Client Browser #5</text>
    <path d="M 170 360 L 220 280" class="flow-blue" marker-end="url(#arr-blue)"/>

    <rect x="15" y="275" width="110" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="70" y="295" text-anchor="middle" font-size="11" fill="#1e40af">Client Browser #6</text>
    <path d="M 170 406 L 220 280" class="flow-blue" marker-end="url(#arr-blue)"/>

  </g>

  <!-- Tier 1 Server: Web Server (Public) -->
  <g transform="translate(220, 120)">
    <rect width="160" height="335" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="160" height="35" rx="10" fill="#dbeafe"/>
    <text x="80" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">1. Web Server</text>
    <rect x="15" y="55" width="130" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="80" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Nginx / Apache</text>
    
    <text x="80" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">NO BUSINESS CODE</text>
    <text x="80" y="150" text-anchor="middle" font-size="11" fill="#475569">Reverse Proxy</text>
    <text x="80" y="170" text-anchor="middle" font-size="11" fill="#475569">Static Assets</text>
    <text x="80" y="190" text-anchor="middle" font-size="11" fill="#475569">SSL Termination</text>
    <text x="80" y="225" text-anchor="middle" font-size="11" fill="#64748b">Redirects traffic to</text>
    <text x="80" y="240" text-anchor="middle" font-size="11" fill="#64748b">Application Server</text>
    <rect x="20" y="275" width="120" height="30" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="80" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">Public Facing</text>
  </g>

  <!-- Arrow WebServer -> AppServer -->
  <path d="M 385 240 L 455 240" class="flow-purple" marker-end="url(#arr-purple)"/>
  <rect x="395" y="215" width="55" height="20" rx="4" fill="#f3e8ff"/>
  <text x="422" y="229" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Forward</text>

  <!-- Tier 2: Application Server (Private) -->
  <g transform="translate(460, 120)">
    <rect width="210" height="335" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="210" height="35" rx="10" fill="#f3e8ff"/>
    <text x="105" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">2. App Server</text>
    
    <g transform="translate(15, 55)">
      <rect width="180" height="65" rx="6" fill="#fdf4ff" stroke="#e879f9"/>
      <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">Business Logic</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#64748b">Java, Python, Tomcat, .NET</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="180" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Operating System</text>
      <text x="90" y="40" text-anchor="middle" font-size="10" fill="#64748b">Linux (EC2)</text>
    </g>

    <g transform="translate(15, 200)">
      <rect width="180" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Hardware</text>
      <text x="90" y="40" text-anchor="middle" font-size="10" fill="#475569">Dedicated compute/RAM</text>
    </g>

    <rect x="25" y="275" width="160" height="30" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="105" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Private Subnet</text>
  </g>

  <!-- Bidirectional arrows AppServer &lt;-> DB -->
  <path d="M 675 220 L 735 220" class="flow-purple" marker-end="url(#arr-purple)"/>
  <path d="M 735 260 L 675 260" class="flow-green" marker-end="url(#arr-green)"/>
  <text x="705" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Query</text>
  <text x="705" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Data</text>

  <!-- Tier 3: Database Server (Private) -->
  <g transform="translate(740, 120)">
    <rect width="210" height="335" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="210" height="35" rx="10" fill="#dcfce7"/>
    <text x="105" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">3. Database Server</text>
    
    <g transform="translate(15, 55)">
      <rect width="180" height="65" rx="6" fill="#ecfeff" stroke="#67e8f9"/>
      <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0e7490">Database Engine</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#64748b">PostgreSQL, MySQL, Oracle</text>
    </g>

    <g transform="translate(15, 135)">
      <rect width="180" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Storage / Volumes</text>
      <text x="90" y="40" text-anchor="middle" font-size="10" fill="#64748b">EBS / Persistent Data</text>
    </g>

    <g transform="translate(15, 200)">
      <rect width="180" height="50" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
      <text x="90" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Hardware</text>
      <text x="90" y="40" text-anchor="middle" font-size="10" fill="#475569">IOPS &amp; Memory optimized</text>
    </g>

    <rect x="25" y="275" width="160" height="30" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="105" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Private Subnet</text>
  </g>
</svg>