<svg height="300" width="960" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="300" fill="#f8fafc" rx="12"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Deployment Pipeline: Dev → Test → Pre-Prod → PROD Flow</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">Code promotion through staging environments to end-user device</text>

  <!-- Developer Node -->
  <g transform="translate(40, 100)">
    <rect width="130" height="90" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="130" height="28" rx="8" fill="#f1f5f9"/>
    <text x="65" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Developer</text>
    <text x="65" y="55" text-anchor="middle" font-size="12" fill="#2563eb">Local Machine</text>
    <text x="65" y="75" text-anchor="middle" font-size="11" fill="#64748b">Code &amp; Features</text>
  </g>

  <!-- Arrow 1: Dev -> Test -->
  <path d="M 175 145 L 235 145" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Test Env -->
  <g transform="translate(240, 100)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="140" height="28" rx="8" fill="#fef3c7"/>
    <text x="70" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Test Environment</text>
    <text x="70" y="55" text-anchor="middle" font-size="12" fill="#d97706">QA Testing</text>
    <text x="70" y="75" text-anchor="middle" font-size="11" fill="#64748b">Bug verification</text>
  </g>

  <!-- Arrow 2: Test -> Pre-prod -->
  <path d="M 385 145 L 445 145" class="flow-amber" marker-end="url(#arr-amber)"/>

  <!-- Pre-Prod Env -->
  <g transform="translate(450, 100)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="140" height="28" rx="8" fill="#f3e8ff"/>
    <text x="70" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">Pre-Prod (Staging)</text>
    <text x="70" y="55" text-anchor="middle" font-size="12" fill="#9333ea">Mirror of PROD</text>
    <text x="70" y="75" text-anchor="middle" font-size="11" fill="#64748b">Final load test</text>
  </g>

  <!-- Arrow 3: Pre-prod -> Prod -->
  <path d="M 595 145 L 655 145" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- Prod Env -->
  <g transform="translate(660, 100)">
    <rect width="140" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="140" height="28" rx="8" fill="#dcfce7"/>
    <text x="70" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">PROD Environment</text>
    <text x="70" y="55" text-anchor="middle" font-size="12" fill="#16a34a">Live Production</text>
    <text x="70" y="75" text-anchor="middle" font-size="11" fill="#64748b">Real customer traffic</text>
  </g>

  <!-- Arrow 4: Prod -> Dev / Client Mobile -->
  <path d="M 805 145 L 855 145" class="flow-green" marker-end="url(#arr-green)"/>

  <!-- Client Mobile -->
  <g transform="translate(860, 95)">
    <rect width="60" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="15" y="8" width="30" height="4" rx="2" fill="#94a3b8"/>
    <text x="30" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Mobile</text>
    <text x="30" y="68" text-anchor="middle" font-size="9" fill="#64748b">App / UI</text>
    <circle cx="30" cy="85" r="4" fill="#cbd5e1"/>
  </g>

  <!-- Step indicators -->
  <text x="208" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Deploy</text>
  <text x="418" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Promote</text>
  <text x="628" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#9333ea">Release</text>
  <text x="830" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">Access</text>

  <rect x="180" y="235" width="600" height="35" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="480" y="257" text-anchor="middle" font-size="12" fill="#475569">Code is never deployed directly to Prod — it must pass Test &amp; Pre-Prod first.</text>
</svg>