<svg height="380" width="840" viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="840" height="380" fill="#f8fafc" rx="12"/>
  <text x="420" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Scalability (Vertical Scaling): Upgrading Server Capacity</text>
  <text x="420" y="60" text-anchor="middle" font-size="13" fill="#64748b">Scale Up: Increasing CPU / RAM by changing the EC2 Instance Type (Long-Term)</text>

  <!-- Before: 8GB RAM DB Server -->
  <g transform="translate(80, 100)">
    <rect width="240" height="190" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="240" height="30" rx="10" fill="#f1f5f9"/>
    <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Database Server (Before)</text>
    
    <g transform="translate(20, 45)">
      <rect width="200" height="40" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="100" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">8 GB RAM (Slow!)</text>

      <rect y="50" width="200" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="100" y="75" text-anchor="middle" font-size="12" fill="#475569">2 vCPU • 10TB Storage</text>
    </g>

    <text x="120" y="165" text-anchor="middle" font-size="11" fill="#dc2626">&#9888; Server is slowing down</text>
  </g>

  <!-- Scale Up Arrow -->
  <g transform="translate(340, 160)">
    <path d="M 10 35 L 130 35" class="flow-purple" marker-end="url(#arr-purple)"/>
    <rect x="25" y="0" width="90" height="24" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="70" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">SCALE UP</text>
    <text x="70" y="55" text-anchor="middle" font-size="10" fill="#64748b">Stop instance,</text>
    <text x="70" y="68" text-anchor="middle" font-size="10" fill="#64748b">change type, restart</text>
  </g>

  <!-- After: 32GB RAM DB Server -->
  <g transform="translate(500, 100)">
    <rect width="260" height="190" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="260" height="30" rx="10" fill="#dcfce7"/>
    <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Database Server (Upgraded)</text>
    
    <g transform="translate(20, 45)">
      <rect width="220" height="40" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="110" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">32 GB RAM (✓ Fast!)</text>

      <rect y="50" width="220" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="110" y="75" text-anchor="middle" font-size="12" fill="#475569">8 vCPU • 10TB Storage</text>
    </g>

    <text x="130" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">✓ Long-term permanent upgrade</text>
  </g>

  <!-- Footer comparison -->
  <rect x="150" y="320" width="540" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="420" y="341" text-anchor="middle" font-size="12" fill="#475569">Scalability = Vertical (change machine specs) • Elasticity = Horizontal (add/remove machines)</text>
</svg>