<svg height="420" width="860" viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#f8fafc" rx="12"/>
  <text x="430" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Load Balancer Traffic Distribution (Round Robin)</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#64748b">Single Public Hostname → Distributed across multiple Private Application Servers</text>

  <!-- Client -->
  <g transform="translate(50, 140)">
    <rect width="160" height="130" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="160" height="28" rx="8" fill="#dbeafe"/>
    <text x="80" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">User / Shashank</text>
    <text x="80" y="60" text-anchor="middle" font-size="11" fill="#475569">Requests Domain:</text>
    <rect x="15" y="75" width="130" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="80" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">http://shash.com</text>
  </g>

  <!-- Arrow Client -> LB -->
  <path d="M 215 205 L 305 205" class="flow-blue" marker-end="url(#arr-blue)"/>
  <rect x="230" y="180" width="60" height="20" rx="4" fill="#dbeafe"/>
  <text x="260" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">DNS Name</text>

  <!-- Load Balancer -->
  <g transform="translate(310, 80)">
    <rect width="130" height="270" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="130" height="35" rx="10" fill="#fef3c7"/>
    <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">LOAD BALANCER</text>
    <text x="65" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Public Hostname</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" fill="#d97706">shash.com</text>
    
    <rect x="15" y="115" width="100" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="65" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Algorithm</text>
    <text x="65" y="152" text-anchor="middle" font-size="10" fill="#16a34a">Round Robin</text>

    <text x="65" y="200" text-anchor="middle" font-size="10" fill="#64748b">Health Checking</text>
    <text x="65" y="220" text-anchor="middle" font-size="10" fill="#64748b">Port 80 Mapping</text>
    <text x="65" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">HA &amp; Scale</text>
  </g>

  <!-- 3 Application Servers (Right) -->
  <!-- App Server 1 -->
  <g transform="translate(540, 75)">
    <rect width="260" height="70" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#f3e8ff"/>
    <text x="35" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">1</text>
    <text x="145" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">Application Server #1</text>
    <text x="145" y="52" text-anchor="middle" font-size="11" fill="#64748b">IP: 192.168.10.20 (Private)</text>
  </g>
  <path d="M 445 150 C 480 150, 500 110, 535 110" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server 2 -->
  <g transform="translate(540, 175)">
    <rect width="260" height="70" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#f3e8ff"/>
    <text x="35" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">2</text>
    <text x="145" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">Application Server #2</text>
    <text x="145" y="52" text-anchor="middle" font-size="11" fill="#64748b">IP: 192.168.10.21 (Private)</text>
  </g>
  <path d="M 445 210 L 535 210" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- App Server 3 -->
  <g transform="translate(540, 275)">
    <rect width="260" height="70" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#f3e8ff"/>
    <text x="35" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e22ce">3</text>
    <text x="145" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">Application Server #3</text>
    <text x="145" y="52" text-anchor="middle" font-size="11" fill="#64748b">IP: 192.168.10.22 (Private)</text>
  </g>
  <path d="M 445 270 C 480 270, 500 310, 535 310" class="flow-purple" marker-end="url(#arr-purple)"/>

  <!-- Bottom Note -->
  <rect x="180" y="375" width="500" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="430" y="396" text-anchor="middle" font-size="12" fill="#475569">Customers use the domain name; Load Balancer distributes requests to private server IPs.</text>
</svg>