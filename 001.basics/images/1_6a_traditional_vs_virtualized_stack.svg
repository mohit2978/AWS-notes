<svg height="460" width="920" viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#f8fafc" rx="12"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Traditional Physical Architecture vs. Virtualization (VMs)</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#64748b">Single OS per hardware → Multiple isolated Virtual Machines managed by a Hypervisor</text>

  <!-- Left: Traditional Architecture -->
  <g transform="translate(60, 95)">
    <rect width="280" height="320" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect width="280" height="32" rx="10" fill="#f1f5f9"/>
    <text x="140" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Traditional (Physical Host)</text>

    <!-- App -->
    <rect x="25" y="50" width="230" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="140" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Single Application</text>
    
    <!-- OS -->
    <rect x="25" y="125" width="230" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="140" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Host Operating System</text>

    <!-- Hardware -->
    <rect x="25" y="200" width="230" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="140" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Physical Hardware (x86)</text>

    <text x="140" y="295" text-anchor="middle" font-size="11" fill="#dc2626">&#9888; Low resource utilization • Slow setup (3+ hrs)</text>
  </g>

  <!-- Animated Transformation Arrow -->
  <path d="M 360 250 L 460 250" class="flow-purple" marker-end="url(#arr-purple)"/>
  <rect x="375" y="225" width="70" height="22" rx="4" fill="#f3e8ff"/>
  <text x="410" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Evolves</text>

  <!-- Right: Virtualized Stack -->
  <g transform="translate(480, 95)">
    <rect width="380" height="320" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="380" height="32" rx="10" fill="#dbeafe"/>
    <text x="190" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Virtualized Architecture (Host Machine)</text>

    <!-- 4 VMs Container -->
    <g transform="translate(15, 45)">
      <!-- VM 1 -->
      <rect x="0" y="0" width="78" height="95" rx="6" fill="#fdf4ff" stroke="#d946ef"/>
      <text x="39" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#a21caf">VM 1</text>
      <rect x="6" y="35" width="66" height="22" rx="3" fill="#ffffff"/>
      <text x="39" y="50" text-anchor="middle" font-size="9" fill="#0f172a">App 1</text>
      <rect x="6" y="62" width="66" height="22" rx="3" fill="#f1f5f9"/>
      <text x="39" y="77" text-anchor="middle" font-size="9" fill="#64748b">Guest OS</text>

      <!-- VM 2 -->
      <rect x="90" y="0" width="78" height="95" rx="6" fill="#ecfeff" stroke="#06b6d4"/>
      <text x="129" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#0e7490">VM 2</text>
      <rect x="96" y="35" width="66" height="22" rx="3" fill="#ffffff"/>
      <text x="129" y="50" text-anchor="middle" font-size="9" fill="#0f172a">App 2</text>
      <rect x="96" y="62" width="66" height="22" rx="3" fill="#f1f5f9"/>
      <text x="129" y="77" text-anchor="middle" font-size="9" fill="#64748b">Guest OS</text>

      <!-- VM 3 -->
      <rect x="180" y="0" width="78" height="95" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="219" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">VM 3</text>
      <rect x="186" y="35" width="66" height="22" rx="3" fill="#ffffff"/>
      <text x="219" y="50" text-anchor="middle" font-size="9" fill="#0f172a">App 3</text>
      <rect x="186" y="62" width="66" height="22" rx="3" fill="#f1f5f9"/>
      <text x="219" y="77" text-anchor="middle" font-size="9" fill="#64748b">Guest OS</text>

      <!-- VM 4 -->
      <rect x="270" y="0" width="78" height="95" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="309" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">VM 4</text>
      <rect x="276" y="35" width="66" height="22" rx="3" fill="#ffffff"/>
      <text x="309" y="50" text-anchor="middle" font-size="9" fill="#0f172a">App 4</text>
      <rect x="276" y="62" width="66" height="22" rx="3" fill="#f1f5f9"/>
      <text x="309" y="77" text-anchor="middle" font-size="9" fill="#64748b">Guest OS</text>
    </g>

    <!-- Hypervisor -->
    <rect x="15" y="155" width="350" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="190" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">HYPERVISOR (Xen / KVM / VMware ESXi)</text>

    <!-- Hardware -->
    <rect x="15" y="215" width="350" height="50" rx="6" fill="#e2e8f0" stroke="#64748b"/>
    <text x="190" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Underlying Physical Hardware (x86)</text>

    <text x="190" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#16a34a">✓ High density • Rapid provisioning (minutes) • Resource sharing</text>
  </g>
</svg>