<svg height="380" width="860" viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="860" height="380" fill="#f8fafc" rx="16"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Apache Tomcat Application Server Port Binding (8080 vs 80)</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#64748b">Default HTTP port 80 fails to reach non-standard port 8080 unless explicitly specified or forwarded</text>

  <!-- Left: Client Requests -->
  <g transform="translate(40, 95)">
    <rect width="280" height="210" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="280" height="32" rx="12" fill="#3b82f6"/>
    <text x="140" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Client Web Browser</text>

    <!-- Request A: Port 80 (Fails) -->
    <g transform="translate(15, 48)">
      <rect width="250" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="bold" fill="#dc2626">DEFAULT HTTP (Port 80):</text>
      <text x="10" y="33" font-size="11" font-weight="bold" fill="#991b1b">http://192.168.10.20:80</text>
      <text x="235" y="26" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">✕</text>
    </g>

    <!-- Request B: Port 8080 (Success) -->
    <g transform="translate(15, 100)">
      <rect width="250" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="10" y="18" font-size="9" font-weight="bold" fill="#16a34a">EXPLICIT TOMCAT PORT (Port 8080):</text>
      <text x="10" y="33" font-size="11" font-weight="bold" fill="#14532d">http://192.168.10.20:8080</text>
      <text x="235" y="26" text-anchor="middle" font-size="14" fill="#16a34a" font-weight="bold">✔</text>
    </g>

    <!-- Request C: Implicit Port 80 -->
    <g transform="translate(15, 152)">
      <rect width="250" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="18" font-size="9" font-weight="bold" fill="#dc2626">IMPLICIT PORT (Defaults to 80):</text>
      <text x="10" y="33" font-size="11" font-weight="bold" fill="#991b1b">http://192.168.10.20</text>
      <text x="235" y="26" text-anchor="middle" font-size="14" fill="#dc2626" font-weight="bold">✕</text>
    </g>
  </g>

  <!-- Flow Lines -->
  <!-- Port 80 Connection Refused -->
  <path d="M 320,165 C 380,165 410,135 480,135" class="flow-red" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <rect x="365" y="115" width="85" height="20" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="407" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">REFUSED (80)</text>

  <!-- Port 8080 Connection Success -->
  <path d="M 320,215 L 480,215" class="flow-green" stroke-width="3" marker-end="url(#arr-green)"/>
  <rect x="365" y="195" width="85" height="20" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="407" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">CONNECTED</text>

  <!-- Right: Host Server &amp; Tomcat Container -->
  <g transform="translate(485, 80)">
    <!-- Host Machine -->
    <rect width="335" height="240" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="335" height="32" rx="14" fill="#0f172a"/>
    <text x="167" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Host Server: 192.168.10.20 (Linux)</text>

    <!-- Closed Port 80 -->
    <g transform="translate(20, 48)">
      <rect width="135" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="67" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Port 80 (HTTP)</text>
      <text x="67" y="30" text-anchor="middle" font-size="8" fill="#dc2626">No listener active</text>
    </g>

    <!-- Tomcat Container (Port 8080) -->
    <g transform="translate(20, 95)">
      <rect width="295" height="125" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="295" height="24" rx="10" fill="#2563eb"/>
      <text x="147" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Application Container: Apache Tomcat</text>
      
      <g transform="translate(15, 35)">
        <circle cx="20" cy="20" r="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <text x="20" y="26" text-anchor="middle" font-size="16">🐱</text>
        <text x="45" y="18" font-size="13" font-weight="bold" fill="#1e40af">Listening on Port 8080</text>
        <text x="45" y="34" font-size="10" fill="#3b82f6">JVM Web Application Worker (Java Servlet / WAR)</text>
      </g>

      <rect x="15" y="85" width="265" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="147" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">
        Status: 200 OK • Serves Web Application
      </text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <rect x="160" y="340" width="540" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="357" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">
    Solution: To allow requests without ':8080', configure Port Forwarding (80 ➔ 8080) in NGINX / iptables
  </text>
</svg>
