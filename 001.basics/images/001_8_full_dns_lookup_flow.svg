<svg height="620" width="980" viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#f8fafc" rx="12"/>
  <text x="490" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Complete End-to-End DNS Lookup Flow</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#64748b">8-Step recursive lookup from Client browser to SOA and final IP resolution</text>

  <!-- Left: Client &amp; Local DNS -->
  <!-- Laptop -->
  <g transform="translate(60, 100)">
    <rect width="180" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="180" height="32" rx="10" fill="#dbeafe"/>
    <text x="90" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Srinivas's Laptop</text>
    <rect x="20" y="48" width="140" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="90" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">google.com</text>
    <text x="90" y="105" text-anchor="middle" font-size="11" fill="#475569">Browser / OS Cache</text>
    <text x="90" y="125" text-anchor="middle" font-size="10" fill="#64748b">/etc/hosts verified</text>
    <rect x="20" y="135" width="140" height="24" rx="4" fill="#ecfdf5" stroke="#86efac"/>
    <text x="90" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">IP: 142.250.190.46</text>
  </g>

  <!-- Local DNS -->
  <g transform="translate(60, 360)">
    <rect width="180" height="150" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="180" height="32" rx="10" fill="#f3e8ff"/>
    <text x="90" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">Local DNS Resolver</text>
    <text x="90" y="65" text-anchor="middle" font-size="11" fill="#475569">ISP Nameserver</text>
    <text x="90" y="85" text-anchor="middle" font-size="10" fill="#64748b">Maintains query cache</text>
    <rect x="20" y="100" width="140" height="35" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="90" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#9333ea">Cache &amp; Recursive Map</text>
  </g>

  <!-- Arrows Laptop &lt;-> Local DNS -->
  <!-- Step 1: Laptop -> Local DNS -->
  <path d="M 120 275 L 120 355" class="flow-blue" marker-end="url(#arr-blue)"/>
  <rect x="30" y="305" width="80" height="20" rx="4" fill="#dbeafe"/>
  <text x="70" y="319" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">1. Query</text>

  <!-- Step 8: Local DNS -> Laptop -->
  <path d="M 170 355 L 170 275" class="flow-green" marker-end="url(#arr-green)"/>
  <rect x="180" y="305" width="80" height="20" rx="4" fill="#dcfce7"/>
  <text x="220" y="319" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">8. Final IP</text>

  <!-- Right: 3 Tier DNS Servers -->
  <!-- 1. Root Name Server -->
  <g transform="translate(420, 100)">
    <rect width="240" height="90" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="240" height="26" rx="8" fill="#fee2e2"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Root Name Server (RNS)</text>
    <text x="120" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Roots: . (Dot Root)</text>
    <text x="120" y="72" text-anchor="middle" font-size="11" fill="#64748b">Delegates query to .com TLD</text>
  </g>

  <!-- Arrows Local DNS &lt;-> RNS -->
  <path d="M 245 400 C 340 400, 360 145, 415 145" class="flow-purple" marker-end="url(#arr-purple)"/>
  <text x="320" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#9333ea">2. Where is .com?</text>
  <path d="M 415 165 C 380 165, 340 420, 245 420" class="flow-green" marker-end="url(#arr-green)"/>
  <text x="320" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">3. Here is .com TLD IP</text>

  <!-- 2. TLD Server -->
  <g transform="translate(420, 260)">
    <rect width="240" height="90" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="240" height="26" rx="8" fill="#fef3c7"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Top-Level Domain (.com TLD)</text>
    <text x="120" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">TLD: .com Registry</text>
    <text x="120" y="72" text-anchor="middle" font-size="11" fill="#64748b">Directs to google.com Name Server</text>
  </g>

  <!-- Arrows Local DNS &lt;-> TLD -->
  <path d="M 245 440 C 330 440, 360 295, 415 295" class="flow-amber" marker-end="url(#arr-amber)"/>
  <text x="330" y="375" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">4. Who owns google.com?</text>
  <path d="M 415 320 C 360 320, 330 455, 245 455" class="flow-green" marker-end="url(#arr-green)"/>
  <text x="330" y="420" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">5. NS = ns1.google.com</text>

  <!-- 3. Authoritative Name Server / SOA -->
  <g transform="translate(420, 420)">
    <rect width="240" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="240" height="26" rx="8" fill="#dcfce7"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Authoritative NS / SOA Record</text>
    <text x="120" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Start of Authority (SOA)</text>
    <text x="120" y="72" text-anchor="middle" font-size="11" fill="#475569">Definitive DNS Record &amp; TTL</text>
    <rect x="20" y="82" width="200" height="20" rx="4" fill="#f0fdf4"/>
    <text x="120" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">A Record → 142.250.190.46</text>
  </g>

  <!-- Arrows Local DNS &lt;-> SOA -->
  <path d="M 245 475 L 415 475" class="flow-purple" marker-end="url(#arr-purple)"/>
  <text x="330" y="470" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">6. What is IP?</text>
  <path d="M 415 495 L 245 495" class="flow-green" marker-end="url(#arr-green)"/>
  <text x="330" y="515" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">7. 142.250.190.46</text>

  <!-- Info box on right -->
  <g transform="translate(710, 200)">
    <rect width="230" height="220" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="230" height="30" rx="10" fill="#f8fafc"/>
    <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">DNS SOA Record Info</text>
    <g font-size="11" fill="#475569" transform="translate(15, 45)">
      <text y="15">• Administrator email</text>
      <text y="35">• Zone last updated date</text>
      <text y="55">• Refresh &amp; retry timers</text>
      <text y="75">• Zone expiration limit</text>
      <text y="95">• Default TTL (Time-To-Live)</text>
      <text y="125" font-weight="bold" fill="#166534">✓ Conforms to IETF RFCs</text>
      <text y="145" font-size="10" fill="#64748b">Required for every valid zone</text>
    </g>
  </g>

  <rect x="220" y="570" width="540" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="490" y="590" text-anchor="middle" font-size="11" fill="#475569">DNS operates like a globally distributed hierarchical key-value map: &lt;Hostname, IP Address&gt;</text>
</svg>