<svg height="480" width="940" viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-reverse {
        stroke: #64748b;
        stroke-width: 1.8;
        stroke-dasharray: 6 4;
        animation: flow 1.5s linear infinite reverse;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="940" height="480" fill="#f8fafc" rx="16"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">AWS Region Architecture: Ireland (eu-west-1) — 4 Availability Zones</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#64748b">Fully meshed redundant dark fiber topology with cross-region backbone transit connection</text>

  <!-- Ireland Region Boundary -->
  <g transform="translate(30, 70)">
    <rect width="660" height="380" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="660" height="36" rx="16" fill="#eff6ff"/>
    <circle cx="25" cy="18" r="8" fill="#2563eb"/>
    <text x="25" y="22" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">IE</text>
    <text x="45" y="23" font-size="13" font-weight="bold" fill="#1e40af">AWS Region: Ireland (Code: eu-west-1) — 4 AZs</text>

    <!-- Full Mesh Interconnect Lines -->
    <!-- Horizontal: 1a to 1b -->
    <path d="M 230,120 L 430,120" class="flow-purple" stroke-width="2.5"/>
    <!-- Horizontal: 1c to 1d -->
    <path d="M 230,280 L 430,280" class="flow-purple" stroke-width="2.5"/>
    <!-- Vertical: 1a to 1c -->
    <path d="M 160,165 L 160,235" class="flow-cyan" stroke-width="2.5"/>
    <!-- Vertical: 1b to 1d -->
    <path d="M 500,165 L 500,235" class="flow-cyan" stroke-width="2.5"/>
    <!-- Diagonal: 1a to 1d -->
    <path d="M 230,145 L 430,255" class="flow-green" stroke-width="2"/>
    <!-- Diagonal: 1c to 1b -->
    <path d="M 230,255 L 430,145" class="flow-amber" stroke-width="2"/>

    <!-- Central Mesh Hub Badge -->
    <rect x="270" y="185" width="120" height="26" rx="13" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <text x="330" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#4338ca">⚡ Full Mesh Fiber</text>

    <!-- AZ 1a Node (Top Left) -->
    <g transform="translate(90, 75)">
      <rect width="140" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect width="140" height="24" rx="10" fill="#16a34a"/>
      <text x="70" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">AZ: eu-west-1a</text>
      <text x="70" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Datacenter Cluster A</text>
      <text x="70" y="66" text-anchor="middle" font-size="9" fill="#166534">Isolated Power &amp; Flood</text>
      <text x="70" y="80" text-anchor="middle" font-size="9" fill="#15803d">● Fully Operational</text>
    </g>

    <!-- AZ 1b Node (Top Right) -->
    <g transform="translate(430, 75)">
      <rect width="140" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect width="140" height="24" rx="10" fill="#16a34a"/>
      <text x="70" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">AZ: eu-west-1b</text>
      <text x="70" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Datacenter Cluster B</text>
      <text x="70" y="66" text-anchor="middle" font-size="9" fill="#166534">Isolated Power &amp; Flood</text>
      <text x="70" y="80" text-anchor="middle" font-size="9" fill="#15803d">● Fully Operational</text>
    </g>

    <!-- AZ 1c Node (Bottom Left) -->
    <g transform="translate(90, 235)">
      <rect width="140" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect width="140" height="24" rx="10" fill="#16a34a"/>
      <text x="70" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">AZ: eu-west-1c</text>
      <text x="70" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Datacenter Cluster C</text>
      <text x="70" y="66" text-anchor="middle" font-size="9" fill="#166534">Isolated Power &amp; Flood</text>
      <text x="70" y="80" text-anchor="middle" font-size="9" fill="#15803d">● Fully Operational</text>
    </g>

    <!-- AZ 1d Node (Bottom Right) -->
    <g transform="translate(430, 235)">
      <rect width="140" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect width="140" height="24" rx="10" fill="#16a34a"/>
      <text x="70" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">AZ: eu-west-1d</text>
      <text x="70" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Datacenter Cluster D</text>
      <text x="70" y="66" text-anchor="middle" font-size="9" fill="#166534">Isolated Power &amp; Flood</text>
      <text x="70" y="80" text-anchor="middle" font-size="9" fill="#15803d">● Fully Operational</text>
    </g>

    <!-- Bottom summary badge -->
    <rect x="180" y="342" width="300" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="330" y="358" text-anchor="middle" font-size="10" fill="#475569">Each AZ is separated by 10-100 km for fault tolerance</text>
  </g>

  <!-- Inter-Region Transit Connection to Another Region -->
  <path d="M 690,260 L 735,260" class="flow-purple" stroke-width="3" marker-end="url(#arr-purple)"/>

  <g transform="translate(740, 160)">
    <rect width="165" height="200" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#drop-shadow)"/>
    <rect width="165" height="32" rx="14" fill="#9333ea"/>
    <text x="82" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Another AWS Region</text>
    
    <text x="82" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">e.g., us-east-1</text>
    <text x="82" y="82" text-anchor="middle" font-size="10" fill="#9333ea">(N. Virginia)</text>

    <rect x="20" y="105" width="125" height="40" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1"/>
    <text x="82" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#7e22ce">AWS Global Backbone</text>
    <text x="82" y="136" text-anchor="middle" font-size="8" fill="#64748b">Private Fiber Transit</text>

    <text x="82" y="175" text-anchor="middle" font-size="9" fill="#6b21a8">Cross-Region VPC Peering</text>
  </g>
</svg>
