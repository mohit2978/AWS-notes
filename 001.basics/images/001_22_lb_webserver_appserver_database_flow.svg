<svg height="380" width="940" viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="940" height="380" fill="#f8fafc" rx="12"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Full Enterprise Flow: Client → WebServer → AppServer → Database</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#64748b">Numbered 8-step request-and-response roundtrip across all 4 architectural tiers</text>

  <!-- 1. Client -->
  <g transform="translate(40, 110)">
    <rect width="150" height="180" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="150" height="28" rx="8" fill="#dbeafe"/>
    <text x="75" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">1. Client / Browser</text>
    <text x="75" y="65" text-anchor="middle" font-size="11" fill="#475569">Initial Request</text>
    <rect x="15" y="80" width="120" height="26" rx="4" fill="#eff6ff"/>
    <text x="75" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">google.com</text>
    <rect x="15" y="130" width="120" height="30" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="75" y="149" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">8. Render Data ✓</text>
  </g>

  <!-- Forward Flow (Top) Client -> App -->
  <path d="M 195 150 L 335 150" class="flow-blue" marker-end="url(#arr-blue)"/>
  <rect x="210" y="125" width="110" height="22" rx="4" fill="#dbeafe"/>
  <text x="265" y="140" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">2. HTTP Request →</text>

  <!-- 2. Application Server -->
  <g transform="translate(340, 110)">
    <rect width="190" height="180" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="190" height="28" rx="8" fill="#f3e8ff"/>
    <text x="95" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">3. Application Server</text>
    <text x="95" y="60" text-anchor="middle" font-size="11" fill="#475569">Java / Tomcat:8080</text>
    <text x="95" y="80" text-anchor="middle" font-size="10" fill="#64748b">Executes business logic</text>
    <rect x="15" y="100" width="160" height="26" rx="4" fill="#fdf4ff" stroke="#e879f9"/>
    <text x="95" y="117" text-anchor="middle" font-size="10" font-weight="bold" fill="#86198f">Queries Database</text>
    <text x="95" y="150" text-anchor="middle" font-size="10" fill="#166534">7. Formats Response</text>
  </g>

  <!-- Forward Flow App -> DB -->
  <path d="M 535 150 L 675 150" class="flow-purple" marker-end="url(#arr-purple)"/>
  <rect x="555" y="125" width="100" height="22" rx="4" fill="#f3e8ff"/>
  <text x="605" y="140" text-anchor="middle" font-size="9" font-weight="bold" fill="#7e22ce">4. SQL Query →</text>

  <!-- 3. Database Server -->
  <g transform="translate(680, 110)">
    <rect width="190" height="180" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="190" height="28" rx="8" fill="#dcfce7"/>
    <text x="95" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">5. Database Server</text>
    <text x="95" y="60" text-anchor="middle" font-size="11" fill="#475569">MySQL / PostgreSQL</text>
    <text x="95" y="80" text-anchor="middle" font-size="10" fill="#64748b">Extracts records</text>
    <rect x="15" y="100" width="160" height="26" rx="4" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="95" y="117" text-anchor="middle" font-size="10" font-weight="bold" fill="#0e7490">Record Set / IOPS</text>
    <text x="95" y="150" text-anchor="middle" font-size="10" fill="#64748b">Tuning alone is not enough</text>
  </g>

  <!-- Return Flow DB -> App -->
  <path d="M 675 230 L 535 230" class="flow-green" marker-end="url(#arr-green)"/>
  <rect x="555" y="235" width="100" height="22" rx="4" fill="#dcfce7"/>
  <text x="605" y="250" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">← 6. Query Results</text>

  <!-- Return Flow App -> Client -->
  <path d="M 335 230 L 195 230" class="flow-green" marker-end="url(#arr-green)"/>
  <rect x="210" y="235" width="110" height="22" rx="4" fill="#dcfce7"/>
  <text x="265" y="250" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">← 7. HTML Response</text>

  <!-- Footer -->
  <rect x="200" y="325" width="540" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="470" y="346" text-anchor="middle" font-size="12" fill="#475569">Complete roundtrip: Client → App → DB → App → Client (Clear separation of concerns).</text>
</svg>