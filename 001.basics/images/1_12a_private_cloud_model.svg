<svg height="440" width="940" viewBox="0 0 940 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="940" height="440" fill="#f8fafc" rx="16"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Private Cloud Deployment Model</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#64748b">Dedicated infrastructure exclusively operated for a single organization behind private enterprise firewalls</text>

  <!-- Left: Private Cloud Architecture -->
  <g transform="translate(40, 75)">
    <rect width="480" height="325" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="480" height="32" rx="14" fill="#eff6ff"/>
    <text x="240" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Private Cloud Infrastructure (Single-Tenant Dedicated)</text>

    <!-- Layer 1: Application -->
    <g transform="translate(30, 48)">
      <rect width="420" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="210" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">🏢 Your Enterprise Applications &amp; Microservices</text>
    </g>

    <!-- Animated Flow -->
    <path d="M 240,90 L 240,110" class="flow-blue" marker-end="url(#arr-blue)"/>

    <!-- Layer 2: Information / Data -->
    <g transform="translate(30, 112)">
      <rect width="420" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="210" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">🔒 Your Proprietary Data &amp; Encrypted Databases</text>
    </g>

    <!-- Animated Flow -->
    <path d="M 240,154 L 240,174" class="flow-blue" marker-end="url(#arr-blue)"/>

    <!-- Layer 3: Virtualized Infrastructure -->
    <g transform="translate(30, 176)">
      <rect width="420" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <text x="210" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">⚡ Enterprise IT Virtualized Stack (VMware / OpenStack)</text>
    </g>

    <!-- Animated Flow -->
    <path d="M 240,218 L 240,238" class="flow-green" marker-end="url(#arr-green)"/>

    <!-- Layer 4: Physical Hardware Stack -->
    <g transform="translate(30, 240)">
      <g transform="translate(0, 0)">
        <rect width="200" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">On-Premises Hardware</text>
        <text x="100" y="42" text-anchor="middle" font-size="9" fill="#64748b">Internal Datacenter Racks</text>
      </g>
      <g transform="translate(220, 0)">
        <rect width="200" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="100" y="24" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Dedicated Hosted Hardware</text>
        <text x="100" y="42" text-anchor="middle" font-size="9" fill="#64748b">Provider Colocation (Single Tenant)</text>
      </g>
    </g>
  </g>

  <!-- Right: Benefits &amp; Disadvantages -->
  <g transform="translate(555, 75)">
    <!-- Benefits -->
    <rect width="345" height="155" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <rect width="345" height="28" rx="12" fill="#dcfce7"/>
    <text x="20" y="19" font-size="11" font-weight="bold" fill="#15803d">✔ BENEFITS OF PRIVATE CLOUD</text>

    <g transform="translate(20, 40)">
      <text x="0" y="18" font-size="11" font-weight="bold" fill="#14532d">• Higher Security &amp; Data Privacy</text>
      <text x="12" y="32" font-size="9" fill="#475569">Total control over physical access and encryption</text>

      <text x="0" y="55" font-size="11" font-weight="bold" fill="#14532d">• Full Architectural Control</text>
      <text x="12" y="69" font-size="9" fill="#475569">Custom configurations tailored to specific legacy apps</text>

      <text x="0" y="92" font-size="11" font-weight="bold" fill="#14532d">• Predictable Performance</text>
      <text x="12" y="106" font-size="9" fill="#475569">No "noisy neighbors" or multi-tenant CPU contention</text>
    </g>

    <!-- Disadvantages -->
    <g transform="translate(0, 170)">
      <rect width="345" height="155" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#drop-shadow)"/>
      <rect width="345" height="28" rx="12" fill="#fee2e2"/>
      <text x="20" y="19" font-size="11" font-weight="bold" fill="#991b1b">✖ DISADVANTAGES &amp; CHALLENGES</text>

      <g transform="translate(20, 40)">
        <text x="0" y="18" font-size="11" font-weight="bold" fill="#991b1b">• High Capital Expenditure (CapEx)</text>
        <text x="12" y="32" font-size="9" fill="#475569">Significant upfront purchases for servers and cooling</text>

        <text x="0" y="55" font-size="11" font-weight="bold" fill="#991b1b">• Limited Scalability</text>
        <text x="12" y="69" font-size="9" fill="#475569">Scaling requires ordering and racking new physical hardware</text>

        <text x="0" y="92" font-size="11" font-weight="bold" fill="#991b1b">• Operational Overhead</text>
        <text x="12" y="106" font-size="9" fill="#475569">Requires dedicated in-house DevOps &amp; maintenance staff</text>
      </g>
    </g>
  </g>
</svg>
