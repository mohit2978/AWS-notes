<svg height="460" width="940" viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-reverse {
        stroke: #64748b;
        stroke-width: 1.8;
        stroke-dasharray: 6 4;
        animation: flow 1.5s linear infinite reverse;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="940" height="460" fill="#f8fafc" rx="16"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Application Deployment Models: AWS EC2 (IaaS) vs. AWS Elastic Beanstalk (PaaS)</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#64748b">Compare manual infrastructure management vs automated application platform deployment</text>

  <!-- Left: Client Application -->
  <g transform="translate(40, 150)">
    <rect width="160" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="160" height="30" rx="12" fill="#2563eb"/>
    <text x="80" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Client Application</text>
    
    <circle cx="80" cy="65" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="80" y="72" text-anchor="middle" font-size="20">☕</text>
    
    <text x="80" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Java / Node / Python</text>
    <text x="80" y="122" text-anchor="middle" font-size="10" fill="#64748b">Source Code / Artifact</text>
    <text x="80" y="137" text-anchor="middle" font-size="9" fill="#0284c7">(.war / .jar / Dockerfile)</text>
  </g>

  <!-- Branching Arrows -->
  <path d="M 200,200 C 260,200 270,120 330,120" class="flow-amber" stroke-width="2.8" marker-end="url(#arr-amber)"/>
  <path d="M 200,230 C 260,230 270,310 330,310" class="flow-green" stroke-width="2.8" marker-end="url(#arr-green)"/>

  <!-- Top Branch: Amazon EC2 (IaaS - Infrastructure as a Service) -->
  <g transform="translate(335, 75)">
    <rect width="560" height="150" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <rect width="560" height="32" rx="12" fill="#fef3c7"/>
    <text x="20" y="21" font-size="13" font-weight="bold" fill="#b45309">Amazon EC2 (IaaS) — Full Manual Control</text>
    <rect x="420" y="6" width="125" height="20" rx="10" fill="#fde68a"/>
    <text x="482" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">YOU MANAGE EVERYTHING</text>

    <g transform="translate(20, 45)">
      <rect width="160" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">1. Provisioning</text>
      <text x="80" y="42" text-anchor="middle" font-size="9" fill="#64748b">• Choose AMI / OS</text>
      <text x="80" y="58" text-anchor="middle" font-size="9" fill="#64748b">• Pick Instance Type</text>
      <text x="80" y="74" text-anchor="middle" font-size="9" fill="#64748b">• Configure Storage (EBS)</text>
    </g>

    <g transform="translate(195, 45)">
      <rect width="160" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">2. Setup &amp; Runtime</text>
      <text x="80" y="42" text-anchor="middle" font-size="9" fill="#64748b">• Install JDK / Web Server</text>
      <text x="80" y="58" text-anchor="middle" font-size="9" fill="#64748b">• Apache / NGINX Setup</text>
      <text x="80" y="74" text-anchor="middle" font-size="9" fill="#64748b">• Configure Ports &amp; Firewalls</text>
    </g>

    <g transform="translate(370, 45)">
      <rect width="170" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="85" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">3. Maintenance</text>
      <text x="85" y="42" text-anchor="middle" font-size="9" fill="#64748b">• OS Security Patches</text>
      <text x="85" y="58" text-anchor="middle" font-size="9" fill="#64748b">• Custom Load Balancing</text>
      <text x="85" y="74" text-anchor="middle" font-size="9" fill="#64748b">• Manual ASG Scaling Rules</text>
    </g>
  </g>

  <!-- Bottom Branch: AWS Elastic Beanstalk (PaaS - Platform as a Service) -->
  <g transform="translate(335, 250)">
    <rect width="560" height="175" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="560" height="32" rx="12" fill="#dcfce7"/>
    <text x="20" y="21" font-size="13" font-weight="bold" fill="#14532d">AWS Elastic Beanstalk (PaaS) — Automated Application Platform</text>
    <rect x="420" y="6" width="125" height="20" rx="10" fill="#86efac"/>
    <text x="482" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">AWS MANAGES PLATFORM</text>

    <!-- PaaS Advantage Text -->
    <text x="20" y="58" font-size="11" font-weight="600" fill="#15803d">
      ✔ Simply upload code + choose platform config: AWS automatically handles provisioning, load balancing, auto-scaling &amp; health!
    </text>

    <!-- Platform Chips Row -->
    <g transform="translate(20, 75)">
      <!-- Tomcat Chip -->
      <g transform="translate(0, 0)">
        <rect width="90" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="45" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">🐱 Tomcat</text>
      </g>
      <!-- .NET Chip -->
      <g transform="translate(100, 0)">
        <rect width="80" height="34" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
        <text x="40" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#7e22ce">🔷 .NET</text>
      </g>
      <!-- Docker Chip -->
      <g transform="translate(190, 0)">
        <rect width="85" height="34" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
        <text x="42" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">🐳 Docker</text>
      </g>
      <!-- Python Chip -->
      <g transform="translate(285, 0)">
        <rect width="85" height="34" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
        <text x="42" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">🐍 Python</text>
      </g>
      <!-- Go Chip -->
      <g transform="translate(380, 0)">
        <rect width="65" height="34" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
        <text x="32" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">🐹 Go</text>
      </g>
      <!-- Node Chip -->
      <g transform="translate(455, 0)">
        <rect width="70" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="35" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">🟩 Node</text>
      </g>
    </g>

    <!-- Automated Features Footer in Beanstalk -->
    <g transform="translate(20, 125)">
      <rect width="520" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="260" y="21" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">
        Auto Features: ELB Setup • Auto Scaling (ASG) • CloudWatch Metrics • Zero-Downtime Rolling Deployments
      </text>
    </g>
  </g>
</svg>
