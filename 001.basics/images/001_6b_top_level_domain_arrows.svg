<svg height="400" width="680" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#f8fafc" rx="12"/>
  <text x="340" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Root Name Server (RNS) → Top-Level Domain (TLD)</text>
  <text x="340" y="58" text-anchor="middle" font-size="12" fill="#64748b">RNS parses the domain suffix and delegates to the appropriate TLD nameserver</text>

  <!-- Target TLDs (Top) -->
  <!-- .org -->
  <g transform="translate(60, 95)">
    <rect width="140" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">.org</text>
    <text x="70" y="58" text-anchor="middle" font-size="11" fill="#64748b">Organizations</text>
  </g>

  <!-- .com (Highlighted / Target) -->
  <g transform="translate(270, 85)">
    <rect width="140" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="35" y="8" width="70" height="20" rx="10" fill="#dbeafe"/>
    <text x="70" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">MATCHED</text>
    <text x="70" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">.com</text>
    <text x="70" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">google.com</text>
  </g>

  <!-- .in -->
  <g transform="translate(480, 95)">
    <rect width="140" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#475569">.in</text>
    <text x="70" y="58" text-anchor="middle" font-size="11" fill="#64748b">India Country TLD</text>
  </g>

  <!-- Flowing branching arrows from RNS to TLDs -->
  <!-- Left to .org -->
  <path d="M 310 270 C 260 230, 160 210, 130 185" class="flow-gray" marker-end="url(#arr-gray)"/>

  <!-- Center to .com (Highlighted active flow) -->
  <path d="M 340 270 L 340 190" class="flow-blue" marker-end="url(#arr-blue)"/>
  <rect x="300" y="215" width="80" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="340" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Routes Here</text>

  <!-- Right to .in -->
  <path d="M 370 270 C 420 230, 520 210, 550 185" class="flow-gray" marker-end="url(#arr-gray)"/>

  <!-- Root Name Server Box (Bottom) -->
  <g transform="translate(200, 275)">
    <rect width="280" height="90" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="280" height="28" rx="10" fill="#fee2e2"/>
    <text x="140" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Root Name Server (RNS)</text>
    <text x="140" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Suffix Evaluator (.com, .org, .in)</text>
    <text x="140" y="70" text-anchor="middle" font-size="11" fill="#64748b">Identifies .com → hands off to .com Nameserver</text>
  </g>
</svg>