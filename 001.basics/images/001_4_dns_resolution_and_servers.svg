<svg height="580" width="1000" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#f8fafc" rx="12"/>
  <text x="500" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">DNS Resolution Flow &amp; Enterprise Web Server Stack</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#64748b">From Domain Query (google.com) to Load Balancer and Application/DB Tiers</text>

  <!-- Left: Client Browser -->
  <g transform="translate(40, 100)">
    <rect width="150" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="150" height="30" rx="10" fill="#dbeafe"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Client Laptop</text>
    <text x="75" y="60" text-anchor="middle" font-size="11" fill="#475569">Browser</text>
    <rect x="15" y="75" width="120" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="75" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">google.com</text>
  </g>

  <!-- Center: DNS Hierarchy Box -->
  <g transform="translate(240, 90)">
    <rect width="320" height="380" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="320" height="32" rx="12" fill="#f3e8ff"/>
    <text x="160" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">DNS Resolution Hierarchy</text>

    <!-- 1. Local DNS -->
    <g transform="translate(20, 45)">
      <rect width="280" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">1. Local DNS / Resolver (ISP)</text>
      <text x="140" y="42" text-anchor="middle" font-size="10" fill="#64748b">Checks local cache first</text>
    </g>

    <!-- 2. Root Name Server -->
    <g transform="translate(20, 120)">
      <rect width="280" height="55" rx="6" fill="#fdf4ff" stroke="#e879f9"/>
      <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">2. Root Name Server (.)</text>
      <text x="140" y="42" text-anchor="middle" font-size="10" fill="#64748b">Directs to .com TLD</text>
    </g>

    <!-- 3. TLD Server -->
    <g transform="translate(20, 195)">
      <rect width="280" height="55" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">3. Top-Level Domain (TLD) (.com)</text>
      <text x="140" y="42" text-anchor="middle" font-size="10" fill="#64748b">Directs to authoritative server</text>
    </g>

    <!-- 4. Authoritative Server -->
    <g transform="translate(20, 270)">
      <rect width="280" height="60" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="140" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">4. Authoritative Server (SOA)</text>
      <text x="140" y="40" text-anchor="middle" font-size="10" fill="#64748b">Returns IP Address: 142.250.190.46</text>
      <text x="140" y="54" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">✓ Caches &amp; returns to Client</text>
    </g>
  </g>

  <!-- Arrows for DNS Query/Response -->
  <path d="M 195 150 L 255 150" class="flow-purple" marker-end="url(#arr-purple)"/>
  <path d="M 255 170 L 195 170" class="flow-green" marker-end="url(#arr-green)"/>
  <text x="225" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Query</text>
  <text x="225" y="186" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">IP</text>

  <!-- Right: Datacenter / Cloud Stack -->
  <!-- Load Balancer -->
  <g transform="translate(610, 140)">
    <rect width="60" height="280" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="30" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af" transform="rotate(-90 30 145)">Load Balancer (ELB)</text>
  </g>

  <!-- HTTP Traffic Arrow Client -> Load Balancer -->
  <path d="M 195 210 C 220 210, 220 490, 400 490 C 530 490, 560 280, 605 280" class="flow-blue" marker-end="url(#arr-blue)"/>
  <rect x="350" y="475" width="130" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="415" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">HTTP GET (IP direct)</text>

  <!-- Server Clusters (Server A &amp; Server B) -->
  <!-- Server A -->
  <g transform="translate(710, 110)">
    <rect width="250" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect width="250" height="26" rx="8" fill="#f1f5f9"/>
    <text x="125" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Server Cluster A</text>
    
    <rect x="15" y="38" width="100" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="65" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Web Server</text>
    <text x="65" y="70" text-anchor="middle" font-size="9" fill="#64748b">Nginx</text>

    <rect x="135" y="38" width="100" height="40" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="185" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#a21caf">App Server</text>
    <text x="185" y="70" text-anchor="middle" font-size="9" fill="#64748b">Tomcat</text>

    <rect x="15" y="90" width="220" height="45" rx="4" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="125" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">Database (Master)</text>
    <text x="125" y="126" text-anchor="middle" font-size="9" fill="#64748b">MySQL / Aurora</text>
  </g>

  <!-- Server B -->
  <g transform="translate(710, 290)">
    <rect width="250" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect width="250" height="26" rx="8" fill="#f1f5f9"/>
    <text x="125" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Server Cluster B</text>
    
    <rect x="15" y="38" width="100" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="65" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Web Server</text>
    <text x="65" y="70" text-anchor="middle" font-size="9" fill="#64748b">Nginx</text>

    <rect x="135" y="38" width="100" height="40" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="185" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#a21caf">App Server</text>
    <text x="185" y="70" text-anchor="middle" font-size="9" fill="#64748b">Tomcat</text>

    <rect x="15" y="90" width="220" height="45" rx="4" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="125" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">Database (Replica)</text>
    <text x="125" y="126" text-anchor="middle" font-size="9" fill="#64748b">MySQL / Aurora</text>
  </g>

  <!-- LB to Server arrows -->
  <path d="M 675 220 L 705 185" class="flow-blue" marker-end="url(#arr-blue)"/>
  <path d="M 675 340 L 705 365" class="flow-blue" marker-end="url(#arr-blue)"/>
</svg>