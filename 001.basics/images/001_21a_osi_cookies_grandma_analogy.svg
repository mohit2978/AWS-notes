<svg height="400" width="880" viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="880" height="400" fill="#f8fafc" rx="12"/>
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Grandma's Cookies Analogy: OSI / TCP-IP Layers</text>
  <text x="440" y="58" text-anchor="middle" font-size="13" fill="#64748b">Road = IP (Routing) • Car = TCP (Transport) • Cookies = HTTP (Application Payload)</text>

  <!-- Left: OSI Protocol Stack -->
  <g transform="translate(40, 90)">
    <rect width="250" height="270" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="125" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">TCP/IP Layer Stack</text>

    <rect x="15" y="40" width="220" height="46" rx="6" fill="#fdf4ff" stroke="#e879f9"/>
    <text x="25" y="60" font-size="11" font-weight="bold" fill="#86198f">APPLICATION LAYER (HTTP)</text>
    <text x="25" y="76" font-size="10" fill="#64748b">The Box of Cookies (Payload data)</text>

    <rect x="15" y="95" width="220" height="46" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="25" y="115" font-size="11" font-weight="bold" fill="#1e40af">TRANSPORT LAYER (TCP)</text>
    <text x="25" y="131" font-size="10" fill="#64748b">The Car (Reliable vehicle delivery)</text>

    <rect x="15" y="150" width="220" height="46" rx="6" fill="#ecfdf5" stroke="#86efac"/>
    <text x="25" y="170" font-size="11" font-weight="bold" fill="#166534">INTERNET LAYER (IP)</text>
    <text x="25" y="186" font-size="10" fill="#64748b">The Road (Addressing &amp; navigation)</text>

    <rect x="15" y="205" width="220" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="25" y="225" font-size="11" font-weight="bold" fill="#334155">NETWORK INTERFACE</text>
    <text x="25" y="241" font-size="10" fill="#64748b">Physical asphalt / fiber hardware</text>
  </g>

  <!-- Right: Visual Journey (Client to Grandma's House) -->
  <g transform="translate(340, 90)">
    <!-- Road (IP) -->
    <rect x="50" y="140" width="420" height="50" rx="8" fill="#334155"/>
    <line x1="60" y1="165" x2="460" y2="165" stroke="#fbbf24" stroke-width="3" stroke-dasharray="16 10"/>
    <text x="260" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">&#128739; IP = The Road (Path / Navigation)</text>

    <!-- Client House (Left) -->
    <rect x="10" y="90" width="80" height="60" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="5,90 50,60 95,90" fill="#2563eb"/>
    <text x="50" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Client</text>
    <text x="50" y="132" text-anchor="middle" font-size="9" fill="#475569">Origin</text>

    <!-- Car (TCP) moving on road with cookies (HTTP) inside -->
    <g transform="translate(200, 142)">
      <!-- Car Body -->
      <rect x="15" y="10" width="90" height="28" rx="6" fill="#3b82f6"/>
      <rect x="35" y="0" width="50" height="15" rx="4" fill="#60a5fa"/>
      <circle cx="35" cy="38" r="8" fill="#0f172a"/>
      <circle cx="85" cy="38" r="8" fill="#0f172a"/>
      <!-- Cookies payload -->
      <rect x="42" y="3" width="36" height="11" rx="2" fill="#fef3c7" stroke="#d97706"/>
      <text x="60" y="11" text-anchor="middle" font-size="8" font-weight="bold" fill="#92400e">&#127850; Cookies</text>
      <text x="60" y="27" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">TCP (Car)</text>
    </g>

    <!-- Animated Path from Client to Grandma's House -->
    <path d="M 80 165 L 430 165" class="flow-amber"/>

    <!-- Grandma's House (Server, Right) -->
    <rect x="430" y="80" width="90" height="70" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <polygon points="425,80 475,50 525,80" fill="#dc2626"/>
    <text x="475" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Server</text>
    <text x="475" y="128" text-anchor="middle" font-size="9" fill="#991b1b">Grandma's</text>

    <!-- Legend below road -->
    <rect x="60" y="220" width="400" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="260" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">• IP Road drives the TCP Car • TCP Car safely carries HTTP Cookies</text>
    <text x="260" y="258" text-anchor="middle" font-size="10" fill="#64748b">If the road (IP) breaks → Car reroutes. If cookies drop → TCP retransmits.</text>
  </g>
</svg>