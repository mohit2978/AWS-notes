<svg height="360" width="860" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="860" height="360" fill="#f8fafc" rx="12"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">&#10007; The WRONG Way: Exposing Port 8080 to Customers</text>
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#64748b">Customers should never have to specify non-standard ports like 8080</text>

  <!-- Client side -->
  <g transform="translate(40, 110)">
    <rect width="200" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect width="200" height="30" rx="8" fill="#fee2e2"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">&#10007; Bad URL Format</text>
    <rect x="15" y="45" width="170" height="32" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="100" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">http://boom.com:8080</text>
    <text x="100" y="105" text-anchor="middle" font-size="11" fill="#b91c1c">Requires remembering</text>
    <text x="100" y="122" text-anchor="middle" font-size="11" fill="#b91c1c">custom port 8080!</text>
  </g>

  <!-- Arrow Client -> LB -->
  <path d="M 245 185 L 325 185" class="flow-red" marker-end="url(#arr-red)"/>

  <!-- Load Balancer -->
  <g transform="translate(330, 90)">
    <rect width="130" height="200" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect width="130" height="32" rx="10" fill="#f1f5f9"/>
    <text x="65" y="21" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Load Balancer</text>
    <text x="65" y="65" text-anchor="middle" font-size="11" fill="#dc2626">Listening on 8080</text>
    <text x="65" y="85" text-anchor="middle" font-size="10" fill="#64748b">(Non-standard)</text>
    <rect x="15" y="115" width="100" height="40" rx="4" fill="#fee2e2"/>
    <text x="65" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Unsafe Port</text>
    <text x="65" y="146" text-anchor="middle" font-size="9" fill="#991b1b">Browser Warning</text>
  </g>

  <!-- 3 Application Servers -->
  <!-- App 1 -->
  <rect x="560" y="80" width="240" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">App Server 1 (Tomcat :8080)</text>
  <text x="680" y="122" text-anchor="middle" font-size="10" fill="#64748b">Internal IP: 192.168.10.20:8080</text>
  <path d="M 465 160 C 495 160, 520 110, 555 110" class="flow-red" marker-end="url(#arr-red)"/>

  <!-- App 2 -->
  <rect x="560" y="150" width="240" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">App Server 2 (Tomcat :8080)</text>
  <text x="680" y="192" text-anchor="middle" font-size="10" fill="#64748b">Internal IP: 192.168.10.21:8080</text>
  <path d="M 465 190 L 555 190" class="flow-red" marker-end="url(#arr-red)"/>

  <!-- App 3 -->
  <rect x="560" y="220" width="240" height="55" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="680" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">App Server 3 (Tomcat :8080)</text>
  <text x="680" y="262" text-anchor="middle" font-size="10" fill="#64748b">Internal IP: 192.168.10.22:8080</text>
  <path d="M 465 210 C 495 210, 520 250, 555 250" class="flow-red" marker-end="url(#arr-red)"/>

  <!-- Bottom Alert -->
  <rect x="180" y="305" width="500" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="430" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">&#9888; Problem: Customers forget port numbers or trigger ERR_UNSAFE_PORT.</text>
</svg>