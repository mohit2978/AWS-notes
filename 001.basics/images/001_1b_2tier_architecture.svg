<svg height="540" width="920" viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="540" fill="#f8fafc" rx="12"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">2-Tier Architecture</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">Presentation Layer separated from Application &amp; Database Layer</text>

  <!-- Client Layer -->
  <rect x="40" y="80" width="220" height="430" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">Client Layer (UI)</text>
  <text x="150" y="122" text-anchor="middle" font-size="11" fill="#64748b">User machines / browsers</text>

  <rect x="60" y="140" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="160" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #1</text>
  <path d="M 220 156 C 360 156, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="184" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="204" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #2</text>
  <path d="M 220 200 C 360 200, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="228" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="248" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #3</text>
  <path d="M 220 244 C 360 244, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="272" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="292" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #4</text>
  <path d="M 220 288 C 360 288, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="316" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="336" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #5</text>
  <path d="M 220 332 C 360 332, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="360" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="380" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #6</text>
  <path d="M 220 376 C 360 376, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="404" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="424" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #7</text>
  <path d="M 220 420 C 360 420, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <rect x="60" y="448" width="160" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="140" y="468" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">Client Node #8</text>
  <path d="M 220 464 C 360 464, 420 180, 520 180" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Server Layer -->
  <g transform="translate(520, 90)">
    <rect width="360" height="410" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <rect width="360" height="40" rx="12" fill="#1e293b"/>
    <text x="180" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Server Machine (Single Host)</text>

    <!-- Application -->
    <g transform="translate(25, 55)">
      <rect width="310" height="75" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5"/>
      <text x="155" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#a21caf">Application Logic</text>
      <text x="155" y="50" text-anchor="middle" font-size="12" fill="#64748b">Java, Python, .NET, Node.js</text>
    </g>

    <!-- Internal Connector -->
    <path d="M 180 135 L 180 155" class="flow-purple" marker-end="url(#arr-purple)"/>

    <!-- Database -->
    <g transform="translate(25, 160)">
      <rect width="310" height="75" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="155" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">Database</text>
      <text x="155" y="50" text-anchor="middle" font-size="12" fill="#64748b">MySQL, PostgreSQL, Oracle</text>
    </g>

    <!-- OS Layer -->
    <rect x="25" y="250" width="310" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="180" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Operating System (Linux / Windows)</text>

    <!-- Hardware Layer -->
    <rect x="25" y="300" width="310" height="45" rx="6" fill="#e2e8f0" stroke="#64748b"/>
    <text x="180" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Physical Hardware</text>
    <text x="180" y="338" text-anchor="middle" font-size="11" fill="#475569">4GB RAM | 2 vCPU | 50GB SSD</text>

    <!-- Crash Warning banner -->
    <rect x="25" y="355" width="310" height="42" rx="6" fill="#fef2f2" stroke="#ef4444"/>
    <text x="180" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">&#9888; Risk: App + DB compete for same RAM/CPU</text>
    <text x="180" y="388" text-anchor="middle" font-size="10" fill="#b91c1c">Traffic surge causes server crash (e.g. Tatkal ticket issue)</text>
  </g>
</svg>