<svg height="430" width="940" viewBox="0 0 940 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-reverse {
        stroke: #64748b;
        stroke-width: 1.8;
        stroke-dasharray: 6 4;
        animation: flow 1.5s linear infinite reverse;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="940" height="430" fill="#f8fafc" rx="16"/>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">HA Multi-Tier Cluster — Worst Case: 4 Components Down (Zero Downtime!)</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#64748b">Even with lb1, app2, lb3, and db2 simultaneously down, traffic traverses the surviving cross-path without disruption</text>

  <!-- User Node -->
  <g transform="translate(35, 175)">
    <rect width="100" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <text x="50" y="32" text-anchor="middle" font-size="20">👥</text>
    <text x="50" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Users</text>
    <text x="50" y="68" text-anchor="middle" font-size="10" fill="#64748b">Public Web</text>
  </g>

  <!-- Flow 1: User to lb2 (SURVIVING) -->
  <path d="M 135,220 C 160,220 165,295 190,295" class="flow-green" stroke-width="3.5" marker-end="url(#arr-green)"/>

  <!-- TIER 1: Web LB Cluster -->
  <!-- lb1 DOWN -->
  <g transform="translate(190, 75)">
    <rect width="125" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" filter="url(#drop-shadow)"/>
    <rect width="125" height="22" rx="8" fill="#dc2626"/>
    <text x="62" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">lb1 (HAProxy)</text>
    <rect x="27" y="30" width="70" height="18" rx="9" fill="#dc2626"/>
    <text x="62" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✖ DOWN [1]</text>
    <text x="62" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">FAILED</text>
    <text x="62" y="78" text-anchor="middle" font-size="9" fill="#b91c1c">Node Crashed</text>
  </g>
  <!-- lb2 ACTIVE (SURVIVING) -->
  <g transform="translate(190, 255)">
    <rect width="125" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#drop-shadow)"/>
    <rect width="125" height="22" rx="8" fill="#16a34a"/>
    <text x="62" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">lb2 (HAProxy)</text>
    <rect x="27" y="30" width="70" height="18" rx="9" fill="#16a34a"/>
    <text x="62" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✔ ACTIVE</text>
    <text x="62" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">SURVIVING LB</text>
    <text x="62" y="78" text-anchor="middle" font-size="9" fill="#15803d">Serving 100%</text>
  </g>

  <!-- Flow 2: lb2 up to app1 (SURVIVING CROSS-LINK) -->
  <path d="M 315,290 C 345,290 350,120 375,120" class="flow-green" stroke-width="3.5" marker-end="url(#arr-green)"/>

  <!-- TIER 2: App Cluster -->
  <!-- app1 ACTIVE (SURVIVING) -->
  <g transform="translate(375, 75)">
    <rect width="125" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#drop-shadow)"/>
    <rect width="125" height="22" rx="8" fill="#16a34a"/>
    <text x="62" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">app1 (Apache)</text>
    <rect x="27" y="30" width="70" height="18" rx="9" fill="#16a34a"/>
    <text x="62" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✔ ACTIVE</text>
    <text x="62" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">SURVIVING APP</text>
    <text x="62" y="78" text-anchor="middle" font-size="9" fill="#15803d">Port 8080</text>
  </g>
  <!-- app2 DOWN -->
  <g transform="translate(375, 255)">
    <rect width="125" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" filter="url(#drop-shadow)"/>
    <rect width="125" height="22" rx="8" fill="#dc2626"/>
    <text x="62" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">app2 (Apache)</text>
    <rect x="27" y="30" width="70" height="18" rx="9" fill="#dc2626"/>
    <text x="62" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✖ DOWN [2]</text>
    <text x="62" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">FAILED</text>
    <text x="62" y="78" text-anchor="middle" font-size="9" fill="#b91c1c">Kernel Panic</text>
  </g>

  <!-- Flow 3: app1 down to lb4 (SURVIVING CROSS-LINK) -->
  <path d="M 500,120 C 530,120 535,290 560,290" class="flow-green" stroke-width="3.5" marker-end="url(#arr-green)"/>

  <!-- TIER 3: Database LB Cluster -->
  <!-- lb3 DOWN -->
  <g transform="translate(560, 75)">
    <rect width="125" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" filter="url(#drop-shadow)"/>
    <rect width="125" height="22" rx="8" fill="#dc2626"/>
    <text x="62" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">lb3 (DB-HAProxy)</text>
    <rect x="27" y="30" width="70" height="18" rx="9" fill="#dc2626"/>
    <text x="62" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✖ DOWN [3]</text>
    <text x="62" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">FAILED</text>
    <text x="62" y="78" text-anchor="middle" font-size="9" fill="#b91c1c">Network Card Loss</text>
  </g>
  <!-- lb4 PROMOTED TO ACTIVE (SURVIVING) -->
  <g transform="translate(560, 255)">
    <rect width="125" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#drop-shadow)"/>
    <rect width="125" height="22" rx="8" fill="#16a34a"/>
    <text x="62" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">lb4 (DB-HAProxy)</text>
    <rect x="27" y="30" width="70" height="18" rx="9" fill="#16a34a"/>
    <text x="62" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✔ ACTIVE</text>
    <text x="62" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">SURVIVING DB-LB</text>
    <text x="62" y="78" text-anchor="middle" font-size="9" fill="#15803d">Auto-Promoted</text>
  </g>

  <!-- Flow 4: lb4 up to db1 (SURVIVING CROSS-LINK) -->
  <path d="M 685,290 C 715,290 720,120 750,120" class="flow-green" stroke-width="3.5" marker-end="url(#arr-green)"/>

  <!-- TIER 4: Database Cluster -->
  <!-- db1 ACTIVE (SURVIVING) -->
  <g transform="translate(750, 75)">
    <rect width="135" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" filter="url(#drop-shadow)"/>
    <rect width="135" height="22" rx="8" fill="#16a34a"/>
    <text x="67" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">db1 (MySQL)</text>
    <rect x="32" y="30" width="70" height="18" rx="9" fill="#16a34a"/>
    <text x="67" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✔ ACTIVE</text>
    <text x="67" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">SURVIVING DB</text>
    <text x="67" y="78" text-anchor="middle" font-size="9" fill="#15803d">Primary Read/Write</text>
  </g>
  <!-- db2 DOWN -->
  <g transform="translate(750, 255)">
    <rect width="135" height="85" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" filter="url(#drop-shadow)"/>
    <rect width="135" height="22" rx="8" fill="#dc2626"/>
    <text x="67" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">db2 (MySQL)</text>
    <rect x="32" y="30" width="70" height="18" rx="9" fill="#dc2626"/>
    <text x="67" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">✖ DOWN [4]</text>
    <text x="67" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">FAILED</text>
    <text x="67" y="78" text-anchor="middle" font-size="9" fill="#b91c1c">Disk Failure</text>
  </g>

  <!-- Big Green Surviving Path Badge -->
  <rect x="180" y="385" width="580" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">
    Surviving Path: User ➔ lb2 (Active) ➔ app1 (Active) ➔ lb4 (Active) ➔ db1 (Active) [ZERO DOWNTIME]
  </text>
</svg>
