<svg height="400" width="920" viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="400" fill="#f8fafc" rx="12"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Hybrid Cloud Model</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#64748b">Seamless integration of On-Premises / Private Cloud with Public Cloud</text>

  <!-- Left: Private Cloud (Internal / On-Premises) -->
  <g transform="translate(60, 95)">
    <rect width="320" height="260" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="320" height="32" rx="10" fill="#f3e8ff"/>
    <text x="160" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">&#128274; Private Cloud (On-Premises / VPC)</text>
    
    <g transform="translate(20, 50)">
      <rect width="280" height="55" rx="6" fill="#fdf4ff" stroke="#e879f9"/>
      <text x="140" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#86198f">Critical Banking Transactions</text>
      <text x="140" y="42" text-anchor="middle" font-size="10" fill="#64748b">PCI-DSS, Core Ledger, Vault DB</text>

      <rect y="70" width="280" height="55" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="140" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Dedicated Hardware</text>
      <text x="140" y="112" text-anchor="middle" font-size="10" fill="#64748b">Strict regulatory compliance</text>
    </g>

    <rect x="35" y="200" width="250" height="35" rx="6" fill="#fdf2f8" stroke="#f472b6"/>
    <text x="160" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">✓ Maximum Security &amp; Data Control</text>
  </g>

  <!-- Interconnect: Direct Connect / VPN with Animated Bidirectional Flow -->
  <g transform="translate(390, 180)">
    <!-- Forward line (Private -> Public) -->
    <path d="M 0 15 L 130 15" class="flow-purple" marker-end="url(#arr-purple)"/>
    <!-- Return line (Public -> Private) -->
    <path d="M 130 45 L 0 45" class="flow-blue" marker-end="url(#arr-blue)"/>
    <rect x="15" y="-10" width="105" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="67" y="4" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">AWS Direct Connect</text>
    <rect x="25" y="48" width="85" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="67" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">IPsec VPN Tunnel</text>
  </g>

  <!-- Right: Public Cloud (AWS) -->
  <g transform="translate(530, 95)">
    <rect width="330" height="260" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="330" height="32" rx="10" fill="#dbeafe"/>
    <text x="165" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">&#9729; Public Cloud (AWS)</text>

    <g transform="translate(20, 50)">
      <rect width="290" height="55" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="145" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Customer Web / Mobile Portals</text>
      <text x="145" y="42" text-anchor="middle" font-size="10" fill="#64748b">Profile management, search, static pages</text>

      <rect y="70" width="290" height="55" rx="6" fill="#ecfdf5" stroke="#86efac"/>
      <text x="145" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Auto-Scaling Web Servers</text>
      <text x="145" y="112" text-anchor="middle" font-size="10" fill="#64748b">Elastic capacity during peak traffic</text>
    </g>

    <rect x="40" y="200" width="250" height="35" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="165" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">✓ Infinite Scalability &amp; Global CDN</text>
  </g>
</svg>