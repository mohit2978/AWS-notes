<svg height="460" width="920" viewBox="0 0 920 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-reverse {
        stroke: #64748b;
        stroke-width: 1.8;
        stroke-dasharray: 6 4;
        animation: flow 1.5s linear infinite reverse;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="920" height="460" fill="#f8fafc" rx="16"/>

  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Elastic Load Balancer (ELB) with Auto Scaling Group (ASG)</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#64748b">Dynamic fleet scaling: automatically adding or removing EC2 instances based on real-time traffic demand</text>

  <!-- Left: DNS / URL Entry -->
  <g transform="translate(35, 150)">
    <rect width="135" height="110" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <rect width="135" height="24" rx="10" fill="#3b82f6"/>
    <text x="67" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">DNS Name / URL</text>
    <text x="67" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">myapp.aws.com</text>
    <text x="67" y="66" text-anchor="middle" font-size="9" fill="#64748b">Route 53 Alias</text>
    <text x="67" y="82" text-anchor="middle" font-size="9" fill="#2563eb">CNAME Target</text>
    <text x="67" y="98" text-anchor="middle" font-size="9" fill="#15803d">● 100% Uptime</text>
  </g>

  <!-- Flow DNS to ELB -->
  <path d="M 170,205 L 220,205" class="flow-blue" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Elastic Load Balancer Node -->
  <g transform="translate(225, 120)">
    <rect width="150" height="170" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="150" height="30" rx="12" fill="#2563eb"/>
    <text x="75" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">AWS ELB</text>
    
    <circle cx="75" cy="65" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="75" y="72" text-anchor="middle" font-size="18">⚖️</text>
    <text x="75" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Target Group</text>
    <text x="75" y="122" text-anchor="middle" font-size="9" fill="#64748b">Health Check: /health</text>
    <rect x="25" y="134" width="100" height="18" rx="9" fill="#dcfce7"/>
    <text x="75" y="146" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">● ASG Registered</text>
  </g>

  <!-- Flow ELB to ASG Instances -->
  <path d="M 375,180 C 420,180 435,130 480,130" class="flow-green" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 375,205 L 480,205" class="flow-cyan" stroke-width="2.5" marker-end="url(#arr-cyan)"/>
  <path d="M 375,230 C 420,230 435,280 480,280" class="flow-purple" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- Right: Auto Scaling Group Container -->
  <g transform="translate(470, 75)">
    <rect width="415" height="260" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" filter="url(#drop-shadow)"/>
    <rect width="415" height="32" rx="14" fill="#dcfce7"/>
    <text x="15" y="21" font-size="12" font-weight="bold" fill="#14532d">Auto Scaling Group (ASG)</text>
    <text x="400" y="21" text-anchor="end" font-size="10" font-weight="bold" fill="#166534">Min: 1 | Desired: 3 | Max: 10</text>

    <!-- Scale Control Badges at top of ASG -->
    <g transform="translate(25, 42)">
      <rect width="110" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <text x="55" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">📈 Scale Out (+)</text>
    </g>
    <g transform="translate(145, 42)">
      <rect width="110" height="22" rx="11" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="55" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">📉 Scale In (-)</text>
    </g>
    <g transform="translate(265, 42)">
      <rect width="125" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="62" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">⚡ Metric: CPU &gt; 70%</text>
    </g>

    <!-- EC2 Instances inside ASG -->
    <!-- Instance 1 -->
    <g transform="translate(25, 75)">
      <rect width="365" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="10" y="8" width="32" height="32" rx="4" fill="#22c55e"/>
      <text x="26" y="28" text-anchor="middle" font-size="16" fill="#fff">⚙</text>
      <text x="52" y="24" font-size="12" font-weight="bold" fill="#14532d">EC2 Instance (1a)</text>
      <text x="52" y="38" font-size="10" fill="#166534">AZ: ap-south-1a • CPU: 42% • Healthy</text>
      <rect x="285" y="14" width="70" height="20" rx="10" fill="#dcfce7"/>
      <text x="320" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">RUNNING</text>
    </g>

    <!-- Instance 2 -->
    <g transform="translate(25, 133)">
      <rect width="365" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="10" y="8" width="32" height="32" rx="4" fill="#22c55e"/>
      <text x="26" y="28" text-anchor="middle" font-size="16" fill="#fff">⚙</text>
      <text x="52" y="24" font-size="12" font-weight="bold" fill="#14532d">EC2 Instance (1b)</text>
      <text x="52" y="38" font-size="10" fill="#166534">AZ: ap-south-1b • CPU: 38% • Healthy</text>
      <rect x="285" y="14" width="70" height="20" rx="10" fill="#dcfce7"/>
      <text x="320" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">RUNNING</text>
    </g>

    <!-- Instance 3 -->
    <g transform="translate(25, 191)">
      <rect width="365" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect x="10" y="8" width="32" height="32" rx="4" fill="#22c55e"/>
      <text x="26" y="28" text-anchor="middle" font-size="16" fill="#fff">⚙</text>
      <text x="52" y="24" font-size="12" font-weight="bold" fill="#14532d">EC2 Instance (1c)</text>
      <text x="52" y="38" font-size="10" fill="#166534">AZ: ap-south-1c • CPU: 45% • Healthy</text>
      <rect x="285" y="14" width="70" height="20" rx="10" fill="#dcfce7"/>
      <text x="320" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">RUNNING</text>
    </g>
  </g>

  <!-- Scale In / Scale Out Visual Flows -->
  <g transform="translate(180, 360)">
    <rect width="560" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#drop-shadow)"/>
    
    <!-- Scale Out Explanation -->
    <g transform="translate(20, 15)">
      <rect width="240" height="45" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="bold" fill="#15803d">📈 Scale Out Policy:</text>
      <text x="12" y="36" font-size="10" fill="#166534">Traffic spikes &gt; Launch new EC2s automatically</text>
    </g>

    <!-- Scale In Explanation -->
    <g transform="translate(300, 15)">
      <rect width="240" height="45" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="bold" fill="#854d0e">📉 Scale In Policy:</text>
      <text x="12" y="36" font-size="10" fill="#a16207">Traffic cools down &gt; Terminate surplus EC2s to save $$</text>
    </g>
  </g>
</svg>
