<svg height="520" width="900" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f8fafc" rx="12"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Elasticity in Action: Auto Scaling (Scale Out → 6 Instances)</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">Horizontal Scaling: Flipkart Big Billion Days spike triggers Auto Scaling Group</text>

  <!-- Load Balancer -->
  <g transform="translate(50, 110)">
    <rect width="130" height="330" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect width="130" height="35" rx="10" fill="#fef3c7"/>
    <text x="65" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">LOAD BALANCER</text>
    <text x="65" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Auto Scaling</text>
    <text x="65" y="100" text-anchor="middle" font-size="11" fill="#16a34a">Group (ASG)</text>

    <rect x="15" y="130" width="100" height="50" rx="4" fill="#ecfdf5" stroke="#86efac"/>
    <text x="65" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">SCALE OUT</text>
    <text x="65" y="165" text-anchor="middle" font-size="9" fill="#166534">+2 Instances</text>

    <rect x="15" y="200" width="100" height="50" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="65" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">SCALE IN</text>
    <text x="65" y="235" text-anchor="middle" font-size="9" fill="#991b1b">Remove after sale</text>

    <text x="65" y="290" text-anchor="middle" font-size="10" fill="#64748b">Total Nodes: 6</text>
  </g>

  <!-- 6 Instances (4 Base, 2 Auto-Added) -->

  <g transform="translate(500, 80)">
    <rect width="340" height="50" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="12" y="9" width="32" height="32" rx="4" fill="#dcfce7"/>
    <text x="28" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">1</text>
    <text x="120" y="24" font-size="11" font-weight="bold" fill="#16a34a">EC2 #1 (Auto-Added)</text>
    <text x="120" y="39" font-size="10" fill="#64748b">4GB RAM • Identical specs</text>
    <text x="250" y="26" font-size="9" font-weight="bold" fill="#166534">+SCALE OUT</text>
  </g>

  <path d="M 185 275 C 320 275, 380 105, 495 105" class="flow-green" marker-end="url(#arr-green)"/>

  <g transform="translate(500, 142)">
    <rect width="340" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="12" y="9" width="32" height="32" rx="4" fill="#dbeafe"/>
    <text x="28" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">2</text>
    <text x="120" y="24" font-size="11" font-weight="bold" fill="#2563eb">EC2 #2 (Baseline)</text>
    <text x="120" y="39" font-size="10" fill="#64748b">4GB RAM • Identical specs</text>
    
  </g>

  <path d="M 185 275 C 320 275, 380 167, 495 167" class="flow-blue" marker-end="url(#arr-blue)"/>

  <g transform="translate(500, 204)">
    <rect width="340" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="12" y="9" width="32" height="32" rx="4" fill="#dbeafe"/>
    <text x="28" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">3</text>
    <text x="120" y="24" font-size="11" font-weight="bold" fill="#2563eb">EC2 #3 (Baseline)</text>
    <text x="120" y="39" font-size="10" fill="#64748b">4GB RAM • Identical specs</text>
    
  </g>

  <path d="M 185 275 C 320 275, 380 229, 495 229" class="flow-blue" marker-end="url(#arr-blue)"/>

  <g transform="translate(500, 266)">
    <rect width="340" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="12" y="9" width="32" height="32" rx="4" fill="#dbeafe"/>
    <text x="28" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">4</text>
    <text x="120" y="24" font-size="11" font-weight="bold" fill="#2563eb">EC2 #4 (Baseline)</text>
    <text x="120" y="39" font-size="10" fill="#64748b">4GB RAM • Identical specs</text>
    
  </g>

  <path d="M 185 275 C 320 275, 380 291, 495 291" class="flow-blue" marker-end="url(#arr-blue)"/>

  <g transform="translate(500, 328)">
    <rect width="340" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="12" y="9" width="32" height="32" rx="4" fill="#dbeafe"/>
    <text x="28" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">5</text>
    <text x="120" y="24" font-size="11" font-weight="bold" fill="#2563eb">EC2 #5 (Baseline)</text>
    <text x="120" y="39" font-size="10" fill="#64748b">4GB RAM • Identical specs</text>
    
  </g>

  <path d="M 185 275 C 320 275, 380 353, 495 353" class="flow-blue" marker-end="url(#arr-blue)"/>

  <g transform="translate(500, 390)">
    <rect width="340" height="50" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="12" y="9" width="32" height="32" rx="4" fill="#dcfce7"/>
    <text x="28" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">6</text>
    <text x="120" y="24" font-size="11" font-weight="bold" fill="#16a34a">EC2 #6 (Auto-Added)</text>
    <text x="120" y="39" font-size="10" fill="#64748b">4GB RAM • Identical specs</text>
    <text x="250" y="26" font-size="9" font-weight="bold" fill="#166534">+SCALE OUT</text>
  </g>

  <path d="M 185 275 C 320 275, 380 415, 495 415" class="flow-green" marker-end="url(#arr-green)"/>

  <rect x="220" y="465" width="500" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="470" y="486" text-anchor="middle" font-size="12" fill="#475569">Elasticity is short-term: dynamic servers scale in automatically once sale traffic ends.</text>
</svg>