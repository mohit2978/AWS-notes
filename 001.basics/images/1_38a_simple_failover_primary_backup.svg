<svg height="400" width="860" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.9; }
      }
      .flow-blue {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-green {
        stroke: #16a34a;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-amber {
        stroke: #d97706;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-purple {
        stroke: #9333ea;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-red {
        stroke: #dc2626;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-cyan {
        stroke: #0284c7;
        stroke-width: 2.2;
        stroke-dasharray: 8 5;
        animation: flow 1.2s linear infinite;
        fill: none;
      }
      .flow-reverse {
        stroke: #64748b;
        stroke-width: 1.8;
        stroke-dasharray: 6 4;
        animation: flow 1.5s linear infinite reverse;
        fill: none;
      }
    </style>
    <filter id="drop-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="860" height="400" fill="#f8fafc" rx="16"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Simple Server Failover (Active-Standby Redundancy)</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#64748b">Primary server hardware failure triggers automated traffic diversion to backup standby node</text>

  <!-- Left: Network User -->
  <g transform="translate(50, 140)">
    <rect width="130" height="120" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#drop-shadow)"/>
    <circle cx="65" cy="45" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="65" y="52" text-anchor="middle" font-size="22">👤</text>
    <text x="65" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Network User</text>
    <text x="65" y="102" text-anchor="middle" font-size="10" fill="#64748b">Client Request</text>
  </g>

  <!-- Center Cloud: Network / Internet -->
  <g transform="translate(260, 140)">
    <path d="M 30,55 C 5,55 0,35 15,20 C 15,0 45,-5 60,10 C 75,-10 110,-5 120,15 C 140,5 155,25 145,45 C 160,65 140,85 115,80 C 105,100 65,100 50,85 C 30,90 10,75 30,55 Z" fill="url(#cloudGrad)" stroke="#93c5fd" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="80" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Network</text>
    <text x="80" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Internet</text>
  </g>

  <!-- User to Network Flow -->
  <path d="M 180,200 L 260,200" class="flow-blue" marker-end="url(#arr-blue)"/>

  <!-- Top Right: Primary Server (FAILED) -->
  <g transform="translate(520, 75)">
    <rect width="260" height="110" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2" filter="url(#drop-shadow)"/>
    <rect width="260" height="30" rx="12" fill="#ef4444"/>
    <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PRIMARY SERVER (Node A)</text>
    
    <rect x="20" y="42" width="70" height="22" rx="11" fill="#dc2626"/>
    <text x="55" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">✖ DOWN</text>
    <text x="100" y="58" font-size="11" font-weight="bold" fill="#991b1b">HARDWARE OUTAGE</text>
    <text x="20" y="85" font-size="10" fill="#7f1d1d">IP: 192.168.1.10 • Health Check Failed</text>
    <text x="20" y="100" font-size="10" fill="#991b1b">Connections Dropped / Unreachable</text>
  </g>

  <!-- Bottom Right: Backup Server (PROMOTED TO ACTIVE) -->
  <g transform="translate(520, 230)">
    <rect width="260" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#drop-shadow)"/>
    <rect width="260" height="30" rx="12" fill="#16a34a"/>
    <text x="130" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">BACKUP SERVER (Standby Node B)</text>
    
    <rect x="20" y="42" width="80" height="22" rx="11" fill="#16a34a"/>
    <text x="60" y="57" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">✔ ACTIVE</text>
    <text x="110" y="58" font-size="11" font-weight="bold" fill="#14532d">PROMOTED TO PRIMARY</text>
    <text x="20" y="85" font-size="10" fill="#14532d">IP: 192.168.1.11 • Automatic Promotion</text>
    <text x="20" y="100" font-size="10" fill="#15803d">Serving 100% of User Traffic Now</text>
  </g>

  <!-- Failed Traffic Path to Primary -->
  <path d="M 410,180 C 460,180 470,130 520,130" class="flow-red" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <circle cx="470" cy="150" r="10" fill="#dc2626"/>
  <text x="470" y="154" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">✕</text>

  <!-- Successful Failover Path to Backup -->
  <path d="M 410,210 C 455,210 470,285 520,285" class="flow-green" stroke-width="3" marker-end="url(#arr-green)"/>
  
  <!-- Heartbeat / Sync Link between servers -->
  <path d="M 650,185 L 650,230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="585" y="196" width="130" height="20" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="650" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">⚡ Heartbeat Lost</text>

  <!-- Legend Bar -->
  <g transform="translate(140, 360)">
    <rect width="580" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="290" y="18" text-anchor="middle" font-size="11" fill="#334155">
      <tspan font-weight="bold" fill="#dc2626">1. Primary Fails</tspan> ➔ 
      <tspan font-weight="bold" fill="#d97706">2. Heartbeat Lost</tspan> ➔ 
      <tspan font-weight="bold" fill="#16a34a">3. Standby Server Promoted &amp; Traffic Rerouted Instantly</tspan>
    </text>
  </g>
</svg>
