<svg height="360" width="920" viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="920" height="360" fill="#f8fafc" rx="12"/>
  <text x="460" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">HTTP GET Request &amp; Response Flow (over TCP/IP)</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">Standard HTTP/1.1 or HTTP/2 client request and server response cycle</text>

  <!-- Client Browser -->
  <g transform="translate(50, 95)">
    <rect width="180" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="180" height="32" rx="10" fill="#dbeafe"/>
    <text x="90" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Client (Web Browser)</text>
    <text x="90" y="65" text-anchor="middle" font-size="12" fill="#475569">1. User enters URL:</text>
    <rect x="15" y="78" width="150" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="90" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">http://host:80/path</text>
    <text x="90" y="135" text-anchor="middle" font-size="11" fill="#64748b">5. Formats &amp; renders</text>
    <text x="90" y="152" text-anchor="middle" font-size="11" fill="#64748b">HTML / CSS / JS DOM</text>
  </g>

  <!-- Middle: HTTP Channels -->
  <!-- 1. Request Channel (Top) -->
  <path d="M 235 140 L 675 140" class="flow-blue" marker-end="url(#arr-blue)"/>
  <g transform="translate(350, 100)">
    <rect width="220" height="36" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">2. HTTP Request (GET /path)</text>
    <text x="110" y="30" text-anchor="middle" font-size="10" fill="#475569">Host: host:80 | Accept: text/html</text>
  </g>

  <!-- 2. Response Channel (Bottom) -->
  <path d="M 675 220 L 235 220" class="flow-green" marker-end="url(#arr-green)"/>
  <g transform="translate(350, 230)">
    <rect width="220" height="36" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">← 4. HTTP Response (200 OK)</text>
    <text x="110" y="30" text-anchor="middle" font-size="10" fill="#475569">Content-Type: text/html; charset=utf-8</text>
  </g>

  <!-- Server -->
  <g transform="translate(685, 95)">
    <rect width="180" height="180" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect width="180" height="32" rx="10" fill="#dcfce7"/>
    <text x="90" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Server (@ host:80)</text>
    <text x="90" y="65" text-anchor="middle" font-size="12" fill="#475569">3. Processes Request</text>
    <rect x="15" y="78" width="150" height="26" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="90" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Maps URL to file/app</text>
    <text x="90" y="135" text-anchor="middle" font-size="11" fill="#64748b">Generates payload</text>
    <text x="90" y="152" text-anchor="middle" font-size="11" fill="#64748b">Returns HTML stream</text>
  </g>

  <!-- Bottom protocol note -->
  <rect x="250" y="305" width="420" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="460" y="326" text-anchor="middle" font-size="12" fill="#475569">HTTP uses default port 80; HTTPS uses default port 443 over TCP.</text>
</svg>