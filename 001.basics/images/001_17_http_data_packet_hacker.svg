<svg height="400" width="780" viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-gray { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 4; animation: flow 1.4s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#f8fafc" rx="12"/>
  <text x="390" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">Security Risk: Unencrypted HTTP Packet Interception</text>
  <text x="390" y="60" text-anchor="middle" font-size="13" fill="#64748b">HTTP transmits payload in Clear Text — vulnerable to Man-in-the-Middle (MITM) snooping</text>

  <!-- Network transit path -->
  <path d="M 50 200 L 730 200" stroke="#94a3b8" stroke-width="6" stroke-dasharray="12 6" fill="none"/>

  <!-- HTTP Data Packet moving on path -->
  <g transform="translate(180, 110)">
    <rect width="250" height="170" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="250" height="30" rx="8" fill="#fee2e2"/>
    <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">HTTP Data Packet (Unencrypted)</text>
    
    <g font-size="11" fill="#334155" transform="translate(15, 45)">
      <text y="15"><tspan font-weight="bold" fill="#64748b">Source:</tspan> 192.168.1.10</text>
      <text y="35"><tspan font-weight="bold" fill="#64748b">Destination:</tspan> 142.250.190.46</text>
      <text y="55"><tspan font-weight="bold" fill="#64748b">Protocol:</tspan> HTTP (Port 80)</text>
      <text y="75"><tspan font-weight="bold" fill="#dc2626">Data:</tspan> CC: 4532 8912 3456 | CVV: 789</text>
      <text y="95" font-weight="bold" fill="#dc2626">× Security: NOT ENCRYPTED (Plaintext)</text>
    </g>
  </g>

  <!-- Hacker Node (Top Right) -->
  <g transform="translate(530, 80)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#dc2626" stroke-width="2"/>
    <circle cx="35" cy="45" r="18" fill="#fee2e2"/>
    <text x="35" y="52" text-anchor="middle" font-size="18">&#128373;</text>
    <text x="120" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef4444">Hacker / Sniffer</text>
    <text x="120" y="58" text-anchor="middle" font-size="11" fill="#f8fafc">Wireshark / MITM</text>
    <text x="120" y="74" text-anchor="middle" font-size="10" fill="#fca5a5">Reads plain text data!</text>
  </g>

  <!-- Animated Sniffing Arrow from packet to hacker -->
  <path d="M 435 150 C 470 140, 500 135, 525 135" class="flow-red" marker-end="url(#arr-red)"/>
  <rect x="440" y="115" width="80" height="20" rx="4" fill="#fee2e2"/>
  <text x="480" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">Intercepts</text>

  <!-- Bottom Recommendation -->
  <rect x="140" y="320" width="500" height="35" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="390" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">✓ Solution: Use HTTPS with SSL/TLS certificates to encrypt all packet payloads!</text>
</svg>