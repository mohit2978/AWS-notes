<svg height="340" width="780" viewBox="0 0 780 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  
  <defs>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes reverse-flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      .flow-blue { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-green { stroke: #16a34a; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-red { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-purple { stroke: #9333ea; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
      .flow-amber { stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 8 5; animation: flow 1.2s linear infinite; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="780" height="340" fill="#f8fafc" rx="12"/>
  <text x="390" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">DNS Resolution Step: Laptop → Local DNS → Root Name Server</text>
  <text x="390" y="60" text-anchor="middle" font-size="12" fill="#64748b">When cache misses, query forwards recursively to Root Name Servers</text>

  <!-- Laptop -->
  <g transform="translate(60, 110)">
    <rect width="180" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect width="180" height="32" rx="8" fill="#dbeafe"/>
    <text x="90" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Srinivas's Laptop</text>
    <text x="90" y="65" text-anchor="middle" font-size="12" fill="#475569">Browser Cache Miss</text>
    <text x="90" y="85" text-anchor="middle" font-size="11" fill="#64748b">/etc/hosts checked</text>
    <rect x="25" y="100" width="130" height="26" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="90" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">google.com</text>
  </g>

  <!-- Local DNS -->
  <g transform="translate(320, 110)">
    <rect width="180" height="140" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect width="180" height="32" rx="8" fill="#f3e8ff"/>
    <text x="90" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#7e22ce">Local DNS Server</text>
    <text x="90" y="65" text-anchor="middle" font-size="12" fill="#475569">ISP Resolver Cache</text>
    <text x="90" y="85" text-anchor="middle" font-size="11" fill="#64748b">IP not found in cache</text>
    <rect x="25" y="100" width="130" height="26" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="90" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#9333ea">Recursive Query</text>
  </g>

  <!-- Root Name Server -->
  <g transform="translate(580, 110)">
    <rect width="180" height="140" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect width="180" height="32" rx="8" fill="#fee2e2"/>
    <text x="90" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Root Name Server (RNS)</text>
    <text x="90" y="65" text-anchor="middle" font-size="12" fill="#475569">Top of DNS Tree (.)</text>
    <text x="90" y="85" text-anchor="middle" font-size="11" fill="#64748b">Inspects TLD (.com)</text>
    <rect x="25" y="100" width="130" height="26" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="90" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Points to .com TLD</text>
  </g>

  <!-- Connectors -->
  <!-- 1. Laptop -> Local DNS -->
  <path d="M 245 160 L 315 160" class="flow-blue" marker-end="url(#arr-blue)"/>
  <text x="280" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">1. Query</text>

  <!-- 2. Local DNS -> RNS -->
  <path d="M 505 160 L 575 160" class="flow-purple" marker-end="url(#arr-purple)"/>
  <text x="540" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#9333ea">2. Forward</text>

  <!-- 3. RNS -> Local DNS response -->
  <path d="M 575 200 L 505 200" class="flow-green" marker-end="url(#arr-green)"/>
  <text x="540" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">← .com TLD IP</text>
</svg>